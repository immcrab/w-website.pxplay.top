<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Messenger | Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Bungee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; overflow: hidden; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scrollbar-width: none; }
    </style>
</head>
<body>

    <div id="chat-container" class="glass-card border border-white/10">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
            <div>
                <h2 class="font-['Bungee'] text-xl tracking-tighter">SECURE CHAT</h2>
                <p id="display-name" class="text-[10px] text-purple-500 font-bold uppercase tracking-widest">ID: LOADING...</p>
            </div>
            <a href="index.html" class="text-xs font-bold text-gray-500 hover:text-white transition">BACK TO HUB</a>
        </div>

        <div id="chat-window"></div>

        <div class="p-6 bg-white/5 border-t border-white/10">
            <div class="flex gap-3">
                <input type="text" id="msg-input" placeholder="Say something..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-sm outline-none focus:border-purple-500">
                <button id="send-btn" class="action-btn px-8 py-4">SEND</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'messages');

        // Handle Persistent Identity
        let myId = localStorage.getItem('w_user_id');
        if (!myId) {
            myId = 'Guest' + Math.floor(100 + Math.random() * 900);
            localStorage.setItem('w_user_id', myId);
        }
        document.getElementById('display-name').innerText = "ID: " + myId;

        // Color Generator for other users
        const getOtherColor = (userId) => {
            let hash = 0;
            for (let i = 0; i < userId.length; i++) {
                hash = userId.charCodeAt(i) + ((hash << 5) - hash);
            }
            return `hsl(${Math.abs(hash % 360)}, 60%, 40%)`;
        };

        // Listen for messages
        onValue(chatRef, (snapshot) => {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                const isMe = data.user === myId;
                
                const bubble = document.createElement('div');
                bubble.className = `message-bubble ${isMe ? 'my-message' : 'other-message'}`;
                
                if (!isMe) {
                    bubble.style.background = getOtherColor(data.user);
                }

                bubble.innerHTML = `
                    <div class="text-[9px] font-black uppercase opacity-60 mb-1">${data.user}</div>
                    <div>${data.text}</div>
                `;
                chatWindow.appendChild(bubble);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // Send message
        const sendMsg = () => {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                push(chatRef, {
                    user: myId,
                    text: text,
                    timestamp: serverTimestamp()
                });
                input.value = '';
            }
        };

        document.getElementById('send-btn').onclick = sendMsg;
        document.getElementById('msg-input').onkeydown = (e) => { if(e.key === 'Enter') sendMsg(); };
    </script>
</body>
</html>
