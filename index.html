<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W | Official Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db; // Global access for the functions below
    </script>

    <style>
        :root { --accent: #a78bfa; --bg: #020202; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        /* BRANDING: THE GIANT W */
        .w-giant {
            font-size: clamp(160px, 30vw, 320px);
            font-weight: 900;
            line-height: 0.7;
            letter-spacing: -18px;
            font-style: italic;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.03) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 60px rgba(167, 139, 250, 0.15));
            user-select: none;
        }

        .ultra-glass { 
            background: rgba(255, 255, 255, 0.015); 
            backdrop-filter: blur(60px); 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 40px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* INTERACTION: SQUISHY TILES */
        .w-tile { cursor: pointer; }
        .w-tile:hover { 
            transform: scale(1.05) translateY(-12px) rotate(0.5deg); 
            background: rgba(167, 139, 250, 0.04);
            border-color: var(--accent);
            box-shadow: 0 30px 60px -20px rgba(167, 139, 250, 0.2);
        }
        .w-tile:active { transform: scale(0.94); }

        /* OWEN'S GLOBAL ALERT BANNER */
        .alert-bar {
            background: #ff0033;
            color: black;
            font-family: 'Bungee';
            font-size: 10px;
            padding: 8px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 500;
            text-transform: uppercase;
        }

        input, textarea { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.05); 
            color: white; 
            padding: 22px; 
            border-radius: 25px; 
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.07); }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .chat-msg { animation: chatSlide 0.4s ease-out; }
        @keyframes chatSlide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="announcement" class="alert-bar hidden">
        <marquee scrollamount="15" id="announcement-text">ALERT: NETWORK UPGRADE DEPLOYED // STORE TIERS UPDATED</marquee>
    </div>

    <nav class="fixed top-0 left-0 right-0 z-[100] p-12 flex justify-between items-center">
        <div onclick="showSection('home')" class="text-5xl font-black italic tracking-tighter cursor-pointer hover:opacity-50 transition">W<span class="text-purple-500">.</span></div>
        <button onclick="toggleModal('login-modal')" id="nav-btn" class="ultra-glass px-12 py-5 text-[10px] font-black uppercase tracking-[0.4em] hover:bg-white hover:text-black transition-all">IDENTIFY</button>
    </nav>

    <section id="home-sec" class="min-h-screen flex flex-col items-center justify-center text-center px-10 fade-in">
        <div class="mb-32">
            <h1 class="w-giant">W</h1>
            <p id="net-status" class="text-[12px] font-black text-purple-400 uppercase tracking-[1.6em] ml-10 opacity-40 italic">STBY_PROTOCOL_V5</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 w-full max-w-6xl mb-32">
            <div onclick="showSection('hub')" class="ultra-glass p-28 w-tile group">
                <h2 class="text-5xl font-['Bungee'] group-hover:text-purple-400 transition tracking-tighter">HUB</h2>
                <p class="text-[11px] text-gray-600 font-bold uppercase mt-4 tracking-[0.5em]">Secure Comms</p>
            </div>
            <a href="https://wwebsite.sell.app" target="_blank" class="ultra-glass p-28 w-tile group">
                <h2 class="text-5xl font-['Bungee'] group-hover:text-cyan-400 transition tracking-tighter">STORE</h2>
                <p class="text-[11px] text-gray-600 font-bold uppercase mt-4 tracking-[0.5em]">Tiers & Subs</p>
            </a>
        </div>

        <div class="max-w-3xl w-full ultra-glass p-16 border-white/5 mb-32">
            <h3 class="text-2xl font-['Bungee'] mb-12 italic text-gray-400">Support Broadcast</h3>
            <div class="space-y-6">
                <input type="text" id="s-name" placeholder="IDENTIFIER">
                <textarea id="s-msg" placeholder="MESSAGE CONTENT..." class="h-32"></textarea>
                <button onclick="transmit()" class="bg-white text-black w-full py-6 rounded-3xl font-black text-[12px] uppercase tracking-[0.5em] hover:bg-purple-600 hover:text-white transition">Transmit</button>
            </div>
        </div>
    </section>

    <section id="hub-sec" class="hidden pt-40 pb-12 px-12 max-w-[1500px] mx-auto h-[95vh] fade-in">
        <div class="grid grid-cols-4 gap-10 h-full">
            <div class="col-span-1 ultra-glass p-10 flex flex-col gap-6 overflow-y-auto custom-scroll border-white/5">
                <div class="flex justify-between items-center mb-8">
                    <span class="text-[10px] font-black text-purple-500 uppercase tracking-[0.3em]">Channels</span>
                    <button onclick="toggleModal('join-modal')" class="h-12 w-12 bg-white/5 rounded-full font-black text-xl hover:bg-purple-500 transition">+</button>
                </div>
                <div id="side-list" class="space-y-4"></div>
            </div>

            <div class="col-span-3 ultra-glass flex flex-col relative overflow-hidden">
                <div id="hub-lock" class="absolute inset-0 bg-black/98 z-20 flex items-center justify-center">
                    <p class="text-[12px] font-['Bungee'] text-gray-900 tracking-[1em] uppercase">Connect Session</p>
                </div>
                <div class="p-10 border-b border-white/5 bg-white/[0.01]">
                    <h3 id="chat-head" class="font-black italic text-gray-500 text-xl">#UNLINKED</h3>
                </div>
                <div id="msg-feed" class="flex-1 p-12 overflow-y-auto custom-scroll space-y-8"></div>
                <div class="p-10 border-t border-white/5 bg-white/[0.02] flex gap-6">
                    <input type="text" id="m-in" placeholder="Secure input..." class="flex-1">
                    <button onclick="send()" class="bg-white text-black px-20 rounded-3xl font-black text-xs uppercase tracking-widest">Send</button>
                </div>
            </div>
        </div>
    </section>

    <div id="master-console" class="hidden fixed inset-0 bg-black z-[1000] p-20 overflow-y-auto">
        <div class="flex justify-between items-center mb-24">
            <h2 class="text-7xl font-['Bungee'] text-purple-500 italic tracking-tighter">W_CONSOLE</h2>
            <button onclick="toggleModal('master-console')" class="text-gray-600 font-bold underline text-xs">TERMINATE</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-20">
            <div class="ultra-glass p-16 border-purple-500/20">
                <h3 class="text-xs font-black mb-10 text-gray-500 tracking-widest">NETWORK OVERRIDE</h3>
                <label class="block text-[10px] text-purple-400 mb-2">Headline</label>
                <input type="text" id="o-status" placeholder="Operational" class="mb-10">
                <label class="block text-[10px] text-red-600 mb-2">Global Alert</label>
                <input type="text" id="o-alert" placeholder="Emergency Msg" class="mb-12">
                <button onclick="saveAdmin()" class="bg-purple-600 w-full py-6 rounded-3xl font-black text-xs uppercase tracking-widest">COMMIT UPDATES</button>
            </div>
            <div class="ultra-glass p-16 border-white/5">
                <h3 class="text-xs font-black mb-10 text-gray-500 tracking-widest">TRANSMISSION LOGS</h3>
                <div id="o-inbox" class="space-y-6 h-[450px] overflow-y-auto custom-scroll font-mono text-[11px]"></div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/98 z-[600] flex items-center justify-center p-8">
        <div class="ultra-glass p-20 w-full max-w-md text-center border-purple-500/10">
            <h2 class="text-4xl font-['Bungee'] mb-12 italic">BYPASS</h2>
            <input type="email" id="u-mail" placeholder="ADMIN@W.NET" class="mb-10 w-full">
            <button onclick="auth()" class="bg-white text-black w-full py-6 rounded-3xl font-black text-xs tracking-[0.3em]">IDENTIFY</button>
        </div>
    </div>

    <div id="join-modal" class="hidden fixed inset-0 bg-black/98 z-[600] flex items-center justify-center p-8">
        <div class="ultra-glass p-20 w-full max-w-md text-center">
            <h2 class="text-3xl font-['Bungee'] mb-10">JOIN SESSION</h2>
            <input type="text" id="u-code" placeholder="CODE" class="text-center tracking-[1em] font-black mb-12 uppercase text-purple-400 text-3xl">
            <button onclick="join()" class="bg-purple-600 w-full py-6 rounded-3xl font-black text-xs uppercase">Connect</button>
        </div>
    </div>

    <script>
        let mail = ""; let logged = false; let sessions = []; let curId = null; let isBoss = false;

        function showSection(id) {
            if(id === 'hub' && !logged) { toggleModal('login-modal'); return; }
            document.getElementById('home-sec').classList.toggle('hidden', id !== 'home');
            document.getElementById('hub-sec').classList.toggle('hidden', id !== 'hub');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function auth() {
            mail = document.getElementById('u-mail').value; if(!mail) return;
            logged = true;
            // CHECK FOR OWNER PRIVILEGES
            if(mail === "wwebsiteofficial@outlook.com") isBoss = true;
            document.getElementById('nav-btn').innerText = mail.split('@')[0].toUpperCase();
            toggleModal('login-modal');
        }

        function join() {
            const code = document.getElementById('u-code').value.toUpperCase(); if(!code) return;
            if(!sessions.find(s => s.id === code)) sessions.push({ id: code, msgs: [] });
            toggleModal('join-modal');
            document.getElementById('u-code').value = "";
            renderList(); selectSession(code);
        }

        function renderList() {
            const list = document.getElementById('side-list');
            list.innerHTML = sessions.map(s => `
                <div onclick="selectSession('${s.id}')" class="p-8 ultra-glass font-black text-sm cursor-pointer ${curId === s.id ? 'border-purple-500 bg-purple-500/10' : ''}">
                    #${s.id}
                </div>
            `).join('');
        }

        function selectSession(id) {
            curId = id; document.getElementById('hub-lock').classList.add('hidden');
            document.getElementById('chat-head').innerText = "#" + id;
            renderMsgs(); renderList();
        }

        function send() {
            const i = document.getElementById('m-in'); if(!i.value || !curId) return;
            const s = sessions.find(x => x.id === curId);
            s.msgs.push({ u: mail.split('@')[0], t: i.value });
            i.value = ""; renderMsgs();
        }

        function renderMsgs() {
            const f = document.getElementById('msg-feed');
            const s = sessions.find(x => x.id === curId);
            f.innerHTML = s.msgs.map(m => `
                <div class="chat-msg bg-white/5 p-8 rounded-[30px] border border-white/5 max-w-[85%]">
                    <p class="text-[10px] text-purple-400 font-black mb-2 uppercase italic tracking-widest">${m.u}</p>
                    <p class="text-sm text-gray-200 leading-relaxed">${m.t}</p>
                </div>
            `).join('');
            f.scrollTop = f.scrollHeight;
        }

        function transmit() {
            const n = document.getElementById('s-name').value; const m = document.getElementById('s-msg').value;
            if(!n || !m) return;
            const log = document.getElementById('o-inbox');
            const d = document.createElement('div');
            d.className = "p-6 ultra-glass mb-4 border-white/5";
            d.innerHTML = `<span class="text-purple-400 font-black">[${n.toUpperCase()}]</span>: ${m}`;
            log.prepend(d);
            alert("Transmission Logged in Master Console.");
            document.getElementById('s-name').value = ""; document.getElementById('s-msg').value = "";
        }

        function saveAdmin() {
            const status = document.getElementById('o-status').value;
            const alertTxt = document.getElementById('o-alert').value;
            if(status) document.getElementById('net-status').innerText = status;
            if(alertTxt) {
                document.getElementById('announcement').classList.remove('hidden');
                document.getElementById('announcement-text').innerText = alertTxt;
            } else {
                document.getElementById('announcement').classList.add('hidden');
            }
            toggleModal('master-console');
        }

        // OWEN'S L+P BYPASS LOGIC
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(keys['l'] && keys['p'] && isBoss) toggleModal('master-console');
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);
    </script>
</body>
</html>
