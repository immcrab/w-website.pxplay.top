<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
    </script>

    <style>
        :root { --accent: #a78bfa; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        .ultra-glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 25px; 
        }

        .w-logo {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -10px;
            font-style: italic;
            background: linear-gradient(to bottom, #fff 30%, rgba(255,255,255,0.1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -40px;
        }

        .btn-main { transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-family: 'Bungee', cursive; }
        .btn-main:hover { transform: translateY(-5px); filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.4)); }
        
        .hidden { display: none !important; }
        
        input { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            padding: 15px; 
            border-radius: 15px; 
            outline: none; 
            width: 100%;
        }

        .chat-tab { cursor: pointer; transition: 0.3s; border-radius: 15px; border: 1px solid transparent; }
        .chat-tab.active { background: rgba(167, 139, 250, 0.1); border-color: var(--accent); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-[100] p-8 flex justify-between items-center">
        <div onclick="showSection('home')" class="text-3xl font-black italic cursor-pointer">W<span class="text-purple-500">.</span></div>
        <button onclick="toggleModal('login-modal')" id="nav-user-btn" class="ultra-glass px-8 py-3 text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-black transition">Sign In</button>
    </nav>

    <section id="home-sec" class="flex flex-col items-center justify-center min-h-screen text-center px-6">
        <div class="animate-in fade-in zoom-in duration-1000">
            <h1 class="w-logo">W</h1>
            <p class="text-[10px] font-black text-purple-500 uppercase tracking-[1em] mb-20 ml-4">Network Hub</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
            <div onclick="showSection('hub')" class="ultra-glass p-16 cursor-pointer btn-main group">
                <h2 class="text-3xl font-['Bungee'] group-hover:text-purple-400 transition">MESSENGER</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mt-2 tracking-widest">Connect to Hub</p>
            </div>
            <a href="https://wwebsite.sell.app" target="_blank" class="ultra-glass p-16 btn-main group">
                <h2 class="text-3xl font-['Bungee'] group-hover:text-cyan-400 transition">STORE</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mt-2 tracking-widest">Official Shop</p>
            </a>
        </div>
    </section>

    <section id="hub-sec" class="hidden pt-32 pb-10 px-8 max-w-7xl mx-auto h-[90vh]">
        <div class="grid grid-cols-4 gap-8 h-full">
            <div class="col-span-1 ultra-glass p-6 flex flex-col gap-3 overflow-y-auto custom-scroll">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[11px] font-black text-gray-500 uppercase tracking-[0.2em]">Active Sessions</span>
                    <button onclick="toggleModal('join-modal')" class="h-8 w-8 bg-white/5 rounded-full hover:bg-purple-500 transition font-bold">+</button>
                </div>
                <div id="session-list" class="space-y-2"></div>
            </div>

            <div class="col-span-3 ultra-glass flex flex-col relative overflow-hidden">
                <div id="hub-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-3xl z-20 flex items-center justify-center">
                    <div class="text-center">
                        <div class="h-12 w-12 border-2 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
                        <p class="text-[11px] font-['Bungee'] text-gray-500 tracking-widest">Awaiting Session Connection</p>
                    </div>
                </div>

                <div class="p-8 border-b border-white/5 flex justify-between items-center bg-white/[0.01]">
                    <h3 id="chat-header" class="font-black italic text-gray-400">#READY_STBY</h3>
                </div>

                <div id="messages" class="flex-1 p-10 overflow-y-auto custom-scroll space-y-6"></div>

                <div class="p-8 border-t border-white/5 bg-white/[0.02] flex gap-4">
                    <input type="text" id="m-input" placeholder="Enter Transmission...">
                    <button onclick="sendMsg()" class="btn-main bg-white text-black px-12 rounded-xl text-[11px] font-black">SEND</button>
                </div>
            </div>
        </div>
    </section>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/95 z-[500] flex items-center justify-center p-6">
        <div class="ultra-glass p-12 w-full max-w-sm text-center">
            <h2 class="text-3xl font-['Bungee'] mb-8 italic">IDENTIFY</h2>
            <input type="email" id="email-in" placeholder="Email Address" class="mb-6">
            <button onclick="handleAuth()" class="btn-main w-full bg-white text-black py-5 rounded-xl text-[11px] font-black">ENTER NETWORK</button>
        </div>
    </div>

    <div id="join-modal" class="hidden fixed inset-0 bg-black/98 z-[500] flex items-center justify-center p-6">
        <div class="ultra-glass p-12 w-full max-w-sm text-center">
            <h2 class="text-2xl font-['Bungee'] mb-2">JOIN CHAT</h2>
            <p class="text-[9px] text-gray-600 font-bold uppercase tracking-widest mb-10 italic">Enter Session Key</p>
            <input type="text" id="code-in" placeholder="W-00" class="text-center tracking-[0.5em] font-black mb-10 uppercase text-purple-400">
            <div class="flex gap-4">
                <button onclick="createSession('Private')" class="flex-1 ultra-glass py-5 text-[10px] font-black hover:bg-white/10 transition">PRIVATE</button>
                <button onclick="createSession('Group')" class="flex-1 bg-purple-600 py-5 rounded-xl text-[10px] font-black transition">GROUP</button>
            </div>
        </div>
    </div>

    <script>
        let user = ""; let loggedIn = false; let sessions = []; let activeId = null;

        function showSection(id) {
            if(id === 'hub' && !loggedIn) { toggleModal('login-modal'); return; }
            document.getElementById('home-sec').classList.toggle('hidden', id !== 'home');
            document.getElementById('hub-sec').classList.toggle('hidden', id !== 'hub');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function handleAuth() {
            user = document.getElementById('email-in').value;
            if(!user) return;
            loggedIn = true;
            document.getElementById('nav-user-btn').innerText = user.split('@')[0].toUpperCase();
            toggleModal('login-modal');
            if(document.getElementById('home-sec').classList.contains('hidden')) showSection('hub');
        }

        function createSession(type) {
            const code = document.getElementById('code-in').value.toUpperCase();
            if(!code) return;
            sessions.push({ id: code, type: type, msgs: [] });
            toggleModal('join-modal');
            document.getElementById('code-in').value = "";
            renderSidebar();
            selectSession(code);
        }

        function renderSidebar() {
            const list = document.getElementById('session-list');
            list.innerHTML = sessions.map(s => `
                <div onclick="selectSession('${s.id}')" class="chat-tab p-5 text-[11px] font-black ${activeId === s.id ? 'active' : 'bg-white/[0.02]'}">
                    <p>#${s.id}</p>
                    <p class="text-[8px] text-gray-600 uppercase italic font-bold mt-1">${s.type}</p>
                </div>
            `).join('');
        }

        function selectSession(id) {
            activeId = id;
            document.getElementById('hub-overlay').classList.add('hidden');
            document.getElementById('chat-header').innerText = "#" + id;
            renderMessages();
            renderSidebar();
        }

        function sendMsg() {
            const input = document.getElementById('m-input');
            if(!input.value || !activeId) return;
            const session = sessions.find(s => s.id === activeId);
            session.msgs.push({ u: user.split('@')[0], t: input.value });
            input.value = "";
            renderMessages();
        }

        function renderMessages() {
            const feed = document.getElementById('messages');
            const session = sessions.find(s => s.id === activeId);
            feed.innerHTML = session.msgs.map(m => `
                <div class="bg-white/5 p-5 rounded-2xl border border-white/5 max-w-[85%] animate-in fade-in slide-in-from-bottom-2 duration-300">
                    <p class="text-[9px] text-purple-400 font-black mb-2 uppercase italic">${m.u}</p>
                    <p class="text-sm text-gray-200 leading-relaxed">${m.t}</p>
                </div>
            `).join('');
            feed.scrollTop = feed.scrollHeight;
        }
    </script>
</body>
</html>
