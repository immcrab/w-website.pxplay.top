<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>W Website | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Bungee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p class="mt-4 font-['Bungee'] text-[10px] tracking-widest text-purple-500">SYSTEM ONLINE</p>
    </div>

    <nav class="fixed top-4 left-0 right-0 z-50 px-4 reveal">
        <div class="max-w-5xl mx-auto glass-card py-3 px-6 flex justify-between items-center rounded-full">
            <div class="text-xl font-black italic text-purple-500">W.</div>
            <div class="flex gap-5 text-[9px] font-bold uppercase tracking-widest text-gray-400">
                <a href="#hub">Hub</a>
                <a href="https://wwebsite.sell.app" target="_blank">Store</a>
                <a href="#vault" id="vault-link" class="hidden text-red-500">Vault</a>
            </div>
        </div>
    </nav>

    <header class="h-screen flex flex-col items-center justify-center text-center px-6 reveal">
        <h1 class="text-6xl md:text-8xl font-['Bungee'] leading-none">W WEBSITE</h1>
        <p class="text-gray-500 text-[10px] md:text-sm font-bold tracking-[0.4em] mt-4 mb-12 uppercase">Professional • Secure • Modern</p>
        <a href="https://wwebsite.sell.app" target="_blank" class="action-btn px-10 py-5 text-sm">SHOP NOW</a>
    </header>

    <section id="hub" class="py-20 px-4 max-w-6xl mx-auto reveal">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-10 rounded-[35px] text-center">
                <div class="text-3xl mb-4">💎</div>
                <h3 class="text-lg font-black mb-2">SUBSCRIPTIONS</h3>
                <p class="text-gray-500 text-xs mb-8">Tiered access for VIP and Executive members.</p>
                <a href="https://wwebsite.sell.app" target="_blank" class="action-btn py-3 text-[10px]">VIEW TIERS</a>
            </div>
            <div class="glass-card p-10 rounded-[35px] text-center">
                <div class="text-3xl mb-4">🎮</div>
                <h3 class="text-lg font-black mb-2">GAMES</h3>
                <p class="text-gray-500 text-xs mb-8">Staff-only betas and community arcade.</p>
                <button class="text-purple-400 font-bold text-[10px]">COMING SOON</button>
            </div>
        </div>
    </section>

    <section id="login-section" class="py-20 px-4 flex justify-center hidden-section reveal">
        <div class="w-full max-w-md glass-card p-10 rounded-[35px]">
            <h2 class="text-xl font-['Bungee'] mb-6 text-center">STAFF ACCESS</h2>
            
            <div id="googleBtn" class="google-btn mb-6">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18" alt="">
                <span>Sign in with Google</span>
            </div>

            <div class="flex items-center gap-4 mb-6 opacity-20">
                <hr class="flex-1 border-white/20">
                <span class="text-[10px] font-bold">OR</span>
                <hr class="flex-1 border-white/20">
            </div>

            <input type="email" id="email" placeholder="Staff Email" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 mb-4 outline-none text-sm focus:border-purple-500">
            <input type="password" id="pass" placeholder="Master Key" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 mb-6 outline-none text-sm focus:border-purple-500">
            <button id="loginBtn" class="w-full action-btn py-4">MANUAL LOGIN</button>
        </div>
    </section>

    <section id="vault" class="py-20 px-4 hidden-section reveal">
        <div class="max-w-2xl mx-auto glass-card p-12 border-red-500/30 rounded-[40px] text-center">
            <h2 class="text-4xl font-['Bungee'] text-red-500 mb-6">THE VAULT</h2>
            <div class="bg-black/40 p-6 rounded-2xl text-[10px] text-gray-500 italic mb-8">
                Master Authority Level 10 Detected.
            </div>
            <button class="action-btn bg-red-600 px-8 py-4 mx-auto">MANAGE SYSTEM</button>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Google Login Logic
        document.getElementById('googleBtn').onclick = () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    alert("Authenticated as: " + user.displayName);
                    // Check if they are the owner
                    if(user.email === "wwebsiteofficial@outlook.com") {
                        showVault();
                    }
                }).catch((error) => {
                    console.error(error);
                    alert("Auth Failed. Check Firebase Console settings.");
                });
        };

        function showVault() {
            document.getElementById('vault').classList.remove('hidden-section');
            document.getElementById('vault').classList.add('active');
            document.getElementById('vault-link').classList.remove('hidden');
            document.getElementById('vault').scrollIntoView({ behavior: 'smooth' });
        }

        window.showVault = showVault; // Make accessible to manual login
    </script>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; handleScrollReveal(); }, 500);
        });

        function handleScrollReveal() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight - 50) el.classList.add('active');
            });
        }
        window.addEventListener('scroll', handleScrollReveal);

        const ownerEmail = "wwebsiteofficial@outlook.com";
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (keys['l'] && keys['p']) {
                const sec = document.getElementById('login-section');
                sec.classList.remove('hidden-section');
                sec.classList.add('active');
                sec.scrollIntoView({ behavior: 'smooth' });
            }
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);

        document.getElementById('loginBtn').addEventListener('click', () => {
            if (document.getElementById('email').value === ownerEmail) {
                window.showVault();
                alert("Owner Manual Access Granted.");
            } else { alert("Staff Identity Verified."); }
        });

        // Security
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && ['c','s','p'].includes(e.key.toLowerCase())) {
                e.preventDefault();
                document.body.classList.add('security-flash');
                setTimeout(() => document.body.classList.remove('security-flash'), 300);
            }
        });
    </script>
</body>
</html>
