<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website 2.0 Testing</title>
    <style>
        /* Banner Styles */
        .testing-banner {
            background-color: #ff9800; /* Vibrant orange to catch attention */
            color: #ffffff;
            text-align: center;
            padding: 12px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 9999; /* Ensures it stays on top of other elements */
        }

        .testing-banner .badge {
            background-color: #ffffff;
            color: #ff9800;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 11px;
            margin-right: 10px;
            display: inline-block;
            vertical-align: middle;
        }

        /* Styling for the rest of your page (Optional) */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .content {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="testing-banner">
        <span class="badge">Beta</span> 
        This website is currently in testing mode for the upcoming launch of Website 2.0. Some features may be unstable.
    </div>
    <div class="content">
        <h1>This Website Will Be Fully Built Very Soon!</h1>
        <p>Official Date:08/01/2026</p>
    </div>

</body>
</html>
