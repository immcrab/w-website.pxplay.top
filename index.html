<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index | Testing Mode</title>
    <style>
        /* Modern reset and centering */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #ffffff 0%, #dfe6e9 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #2d3436;
        }

        .card {
            text-align: center;
            background: #ffffff;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid #f1f2f6;
            width: 90%;
            max-width: 450px;
        }

        .status-badge {
            display: inline-block;
            background: #ffeaa7;
            color: #d63031;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
            font-weight: 800;
            font-size: 2rem;
        }

        p {
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Animated Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #f1f2f6;
            border-radius: 10px;
            overflow: hidden;
            height: 8px;
        }

        .progress-bar {
            width: 70%; /* You can change this % to show progress */
            height: 100%;
            background: #0984e3;
            border-radius: 10px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">Maintenance</div>
        <h1>Testing Mode</h1>
        <p>Our developers are currently testing new features. The site will be back online shortly.</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <p style="font-size: 12px; margin-top: 15px;">Estimated completion: Soon</p>
    </div>

</body>
</html>
