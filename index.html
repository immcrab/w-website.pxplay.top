<!DOCTYPE html>
<html lang="en" class="h-full bg-[#030305]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>W Website - Mobile Entry Gate V25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#030305',
                        gateBorder: '#1c1917', 
                        gateBorderFocus: '#44403c'
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-100 font-sans antialiased flex flex-col justify-center items-center p-4 sm:p-6 selection:bg-slate-800">

    <div id="entry-gate-card" class="w-full max-w-md border border-[#1c1917] bg-[#030305] p-6 sm:p-8 rounded-none shadow-2xl relative transition-all duration-300">
        
        <div class="text-center mb-6 sm:mb-8">
            <h1 class="text-lg sm:text-xl font-bold tracking-widest text-white uppercase">W Mainframe</h1>
            <p class="text-[9px] sm:text-[10px] text-slate-500 mt-1 uppercase tracking-widest">Entry Gate Node V25</p>
        </div>

        <div id="stage-1-container" class="space-y-4">
            <p class="text-[11px] sm:text-xs text-slate-400 text-center uppercase tracking-wider">Authentication Required</p>
            <button id="btn-google-auth" class="w-full min-h-[48px] flex items-center justify-center gap-3 bg-transparent border border-[#1c1917] active:bg-slate-900 sm:hover:border-slate-400 text-slate-200 py-3 px-4 transition-all duration-200 font-medium text-[11px] sm:text-xs uppercase tracking-widest">
                Identity Authentication via Google
            </button>
        </div>

        <div id="stage-2-container" class="hidden space-y-4">
            <div class="border-l border-slate-500 bg-[#0c0a09] p-3 mb-4">
                <p class="text-[9px] sm:text-[10px] text-slate-500 uppercase tracking-wider">Identified Session Account:</p>
                <p id="lbl-session-email" class="text-xs font-mono text-slate-300 break-all mt-0.5"></p>
            </div>
            
            <div class="space-y-2">
                <label for="input-security-key" class="block text-[9px] sm:text-[10px] tracking-widest text-slate-400 uppercase">Security Verification Key</label>
                <input type="password" id="input-security-key" placeholder="••••••••••••••••" class="w-full bg-[#030305] border border-[#1c1917] focus:border-slate-400 text-slate-100 py-3 px-3 outline-none font-mono text-base sm:text-sm transition-all rounded-none appearance-none">
            </div>
            
            <button id="btn-verify-key" class="w-full min-h-[48px] bg-transparent border border-slate-400 active:bg-slate-100 active:text-[#030305] sm:hover:bg-slate-100 sm:hover:text-[#030305] text-slate-200 py-2.5 px-4 font-semibold text-[11px] sm:text-xs uppercase tracking-widest transition-all">
                Validate Security Key
            </button>
        </div>

        <div id="stage-home-container" class="hidden space-y-4 text-center py-6">
            <div class="w-8 h-8 rounded-full border border-emerald-500 flex items-center justify-center mx-auto mb-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            </div>
            <h2 class="text-xs sm:text-sm font-bold tracking-widest uppercase text-emerald-400">Mainframe Link Stable</h2>
            <p class="text-[11px] sm:text-xs text-slate-400">Welcome back to the operational vector core grid.</p>
            <button id="btn-disconnect" class="mt-4 min-h-[44px] px-4 text-[9px] sm:text-[10px] text-slate-500 active:text-slate-300 sm:hover:text-slate-300 uppercase tracking-wider font-mono">
                Disconnect Session
            </button>
        </div>

        <div id="gate-error-log" class="hidden mt-6 p-3 bg-stone-950 border border-red-900/40 text-red-400 text-[11px] font-mono text-center break-words"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChx24EPK7w1f7SGVYraI993TkC89ZxiZo",
            authDomain: "wwebsite-ae20b.firebaseapp.com",
            projectId: "wwebsite-ae20b",
            storageBucket: "wwebsite-ae20b.firebasestorage.app",
            messagingSenderId: "1073638981689",
            appId: "1:1073638981689:web:1fceb547ed3704b782cde8",
            measurementId: "G-HK8S5YRG4J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const AUTHORIZED_TEAM_REGISTRY = [
            "wwebsitesystem@outlook.com",
            "brodywilliams0226@gmail.com",
            "jasepeaslee@gmail.com",
            "bmkeppel3@gmail.com",
            "ammar.staff.w@outlook.com",
            "ombatidj@gmail.com"
        ];

        let authenticatedUserEmail = null;
        let targetDbPathKey = null;

        const stage1View = document.getElementById('stage-1-container');
        const stage2View = document.getElementById('stage-2-container');
        const stageHomeView = document.getElementById('stage-home-container');
        const errorLogView = document.getElementById('gate-error-log');
        const emailLabelView = document.getElementById('lbl-session-email');
        const securityKeyInput = document.getElementById('input-security-key');
        const verifyKeyButton = document.getElementById('btn-verify-key');

        function displayGateError(errorMessage) {
            if (errorMessage) {
                errorLogView.innerText = errorMessage;
                errorLogView.classList.remove('hidden');
            } else {
                errorLogView.classList.add('hidden');
                errorLogView.innerText = '';
            }
        }

        function sanitizeEmailForFirebaseKey(emailStr) {
            return emailStr.replace(/\./g, '_');
        }

        document.getElementById('btn-google-auth').addEventListener('click', () => {
            displayGateError(null);
            const provider = new GoogleAuthProvider();
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    const userEmail = result.user.email ? result.user.email.toLowerCase().trim() : '';
                    processIdentityVerification(userEmail);
                })
                .catch((error) => {
                    displayGateError(`OAUTH EXCEPTION: ${error.message}`);
                });
        });

        function processIdentityVerification(email) {
            if (!AUTHORIZED_TEAM_REGISTRY.includes(email)) {
                displayGateError("Access Denied: Node Unrecognized.");
                signOut(auth).then(() => {
                    authenticatedUserEmail = null;
                    targetDbPathKey = null;
                });
                return;
            }

            authenticatedUserEmail = email;
            targetDbPathKey = sanitizeEmailForFirebaseKey(email);

            emailLabelView.innerText = email;
            stage1View.classList.add('hidden');
            stage2View.classList.remove('hidden');
        }

        verifyKeyButton.addEventListener('click', executeSecurityKeyMatchValidation);
        securityKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !verifyKeyButton.disabled) {
                // Instantly dismiss virtual mobile keyboards on submission
                securityKeyInput.blur();
                executeSecurityKeyMatchValidation();
            }
        });

        function executeSecurityKeyMatchValidation() {
            displayGateError(null);
            const userEnteredPasswordValue = securityKeyInput.value;

            if (!userEnteredPasswordValue) {
                displayGateError("Input required: Key field empty.");
                return;
            }

            const nodeTargetRef = ref(database, `auth_nodes/${targetDbPathKey}`);

            get(nodeTargetRef)
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        const validatedSystemKeyString = snapshot.val();

                        if (userEnteredPasswordValue === validatedSystemKeyString) {
                            stage2View.classList.add('hidden');
                            stageHomeView.classList.remove('hidden');
                        } else {
                            freezeInputInterfaceGate();
                        }
                    } else {
                        displayGateError("Database Error: Auth parameters missing.");
                    }
                })
                .catch((dbError) => {
                    displayGateError(`DATABASE OVERRIDE TRIGGERED: ${dbError.message}`);
                });
        }

        function freezeInputInterfaceGate() {
            securityKeyInput.value = '';
            securityKeyInput.disabled = true;
            verifyKeyButton.disabled = true;
            
            let structuralCountdown = 3;
            displayGateError(`Invalid Key. Frozen for ${structuralCountdown}s.`);

            const intervalToken = setInterval(() => {
                structuralCountdown--;
                if (structuralCountdown > 0) {
                    displayGateError(`Invalid Key. Frozen for ${structuralCountdown}s.`);
                } else {
                    clearInterval(intervalToken);
                    securityKeyInput.disabled = false;
                    verifyKeyButton.disabled = false;
                    displayGateError(null);
                }
            }, 1000);
        }

        document.getElementById('btn-disconnect').addEventListener('click', () => {
            signOut(auth).then(() => {
                authenticatedUserEmail = null;
                targetDbPathKey = null;
                securityKeyInput.value = '';
                stageHomeView.classList.add('hidden');
                stage1View.classList.remove('hidden');
                displayGateError(null);
            });
        });
    </script>
</body>
</html>
