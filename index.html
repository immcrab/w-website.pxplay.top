<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Trebuchet MS, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* Animated background elements */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00d4ff, transparent);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ff006e, transparent);
            border-radius: 50%;
            bottom: -80px;
            right: -80px;
            animation-delay: 2s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #00d4ff, transparent);
            border-radius: 50%;
            top: 50%;
            right: 5%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            50% {
                transform: translateY(30px) translateX(20px);
            }
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            max-width: 700px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00d4ff, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #b8bfff;
            margin-bottom: 40px;
            font-weight: 300;
            line-height: 1.6;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin: 40px 0;
            backdrop-filter: blur(10px);
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 0.95rem;
        }

        .status-label {
            color: #b8bfff;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00d4ff;
            animation: blink 2s infinite;
            margin-right: 8px;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .cta-section {
            margin-top: 50px;
        }

        .email-input {
            display: flex;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        input[type="email"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        input[type="email"]::placeholder {
            color: rgba(184, 191, 255, 0.5);
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .icon {
                font-size: 60px;
            }

            .email-input {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="container">
        <div class="icon">🔧</div>
        <h1>We're Updating</h1>
        <p class="subtitle">Our website is currently under maintenance. We'll be back online shortly with some exciting improvements.</p>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span><span class="status-dot"></span>In Progress</span>
            </div>
            <div class="status-item">
                <span class="status-label">Expected Time:</span>
                <span>A few days</span>
            </div>
            <div class="status-item">
                <span class="status-label">Last Update:</span>
                <span id="update-time">06/01/2026<span>
            </div>
        </div>

        <div class="cta-section">
            <p style="margin-bottom: 20px; color: #b8bfff;">Get notified when we're back</p>
            <form class="email-input" action="https://formspree.io/f/xyzpaqno" method="POST">
                <input type="email" name="email" placeholder="your@email.com" required>
                <button type="submit">Notify Me</button>
            </form>
            <p class="info-text">Notifications will be sent to: <strong>wwebsiteofficial@outlook.com</strong></p>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            alert('Thank you! We\'ll notify you when we\'re back online.');
            event.target.reset();
        }

        // Update the "last update" time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('update-time').textContent = timeString;
        }

        updateTime();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
