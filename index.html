<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W | Universe Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();
        const OWNER_EMAIL = "wwebsitesystem@outlook.com";

        window.loginProcess = async () => {
            const stay = document.getElementById('stay-signed-in').checked;
            await setPersistence(auth, stay ? browserLocalPersistence : browserSessionPersistence);
            await signInWithPopup(auth, provider);
        };

        onAuthStateChanged(auth, async (user) => {
            const gateway = document.getElementById('gateway');
            const main = document.getElementById('main-app');
            
            if (user) {
                gateway.classList.add('hidden');
                main.classList.remove('hidden');
                
                // Set initial data in DB if new user
                const userRef = ref(db, 'users/' + user.uid);
                const snapshot = await get(userRef);
                
                let role = "USER";
                if (user.email === OWNER_EMAIL) role = "OWNER";
                else if (snapshot.exists() && snapshot.val().role) role = snapshot.val().role;

                // Save role and data
                set(userRef, {
                    name: user.displayName,
                    email: user.email,
                    role: role
                });

                setupUI(role, user.displayName);
            } else {
                gateway.classList.remove('hidden');
                main.classList.add('hidden');
            }
        });

        function setupUI(role, name) {
            document.getElementById('user-name').innerText = name.toUpperCase();
            const panelBtn = document.getElementById('panel-trigger');
            const panelTitle = document.getElementById('panel-title');
            
            // ROLE LOGIC
            if (role === "OWNER") {
                panelBtn.classList.remove('hidden');
                panelBtn.classList.add('border-yellow-500', 'text-yellow-500', 'shadow-[0_0_20px_rgba(234,179,8,0.3)]');
                panelTitle.innerText = "UNIVERSAL COMMAND";
                document.getElementById('owner-tools').classList.remove('hidden');
            } else if (role === "STAFF") {
                panelBtn.classList.remove('hidden');
                panelBtn.classList.add('border-cyan-500', 'text-cyan-500');
                panelTitle.innerText = "STAFF PANEL";
                document.getElementById('staff-tools').classList.remove('hidden');
            }
        }

        window.togglePanel = () => {
            document.getElementById('control-panel').classList.toggle('translate-x-full');
        };

        window.logout = () => auth.signOut();
    </script>

    <style>
        :root { --bg: #050508; --p: #a78bfa; }
        * { cursor: none !important; }
        body { background: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        #cursor { width: 10px; height: 10px; background: white; border-radius: 50%; position: fixed; pointer-events: none; z-index: 10000; box-shadow: 0 0 15px white; }
        .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08); border-radius: 35px; transition: 0.4s; }
        .bungee { font-family: 'Bungee'; }
        
        /* SLIDING PANEL */
        #control-panel {
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .squish { transition: transform 0.2s; }
        .squish:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <section id="gateway" class="fixed inset-0 z-[5000] flex flex-col items-center justify-center bg-[#050508] p-6">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_#a78bfa_0%,_transparent_70%)]"></div>
        <h1 class="text-9xl bungee italic mb-10 tracking-tighter">W</h1>
        <div class="glass p-10 w-full max-w-sm text-center relative z-10">
            <button onclick="loginProcess()" class="w-full py-6 bg-white text-black bungee rounded-2xl mb-6 squish">ENTER UNIVERSE</button>
            <label class="flex items-center justify-center gap-3 cursor-pointer">
                <input type="checkbox" id="stay-signed-in" checked class="accent-purple-500">
                <span class="bungee text-[9px] tracking-widest opacity-50">STAY SIGNED IN</span>
            </label>
        </div>
    </section>

    <main id="main-app" class="hidden min-h-screen p-6">
        
        <nav class="flex justify-between items-center max-w-7xl mx-auto mb-16">
            <h2 class="text-4xl bungee italic">W.</h2>
            <div class="flex gap-4">
                <button id="panel-trigger" onclick="togglePanel()" class="hidden glass px-6 py-3 bungee text-[10px] tracking-widest squish">ACCESS PANEL</button>
                <div class="glass px-6 py-3 flex items-center gap-4">
                    <span id="user-name" class="bungee text-[10px] tracking-widest opacity-70">GUEST</span>
                    <button onclick="logout()" class="opacity-30 hover:opacity-100 transition-all"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="glass p-8 min-h-[400px]">
                <div class="flex justify-between mb-8"><h3 class="bungee text-2xl">CONTACTS</h3><i data-lucide="user-plus"></i></div>
                <div id="contact-list"></div>
            </div>

            <div class="glass p-8 min-h-[400px]">
                <div class="flex justify-between mb-8"><h3 class="bungee text-2xl">GROUPS</h3><i data-lucide="users"></i></div>
                <div class="flex gap-2 mb-4">
                    <button class="flex-1 glass py-3 bungee text-[9px]">JOIN CODE</button>
                    <button class="flex-1 bg-white text-black rounded-[20px] bungee text-[9px]">CREATE</button>
                </div>
            </div>

            <div class="glass aspect-[9/16] relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                <div class="absolute bottom-8 left-8">
                    <p class="bungee text-purple-400 text-xs">@W_BOT</p>
                    <p class="text-xs opacity-60">Scanning for new media... 📡</p>
                </div>
            </div>
        </div>

        <aside id="control-panel" class="fixed top-0 right-0 h-full w-full max-w-md bg-[#0a0a0f] border-l border-white/10 z-[6000] translate-x-full p-10">
            <div class="flex justify-between items-center mb-12">
                <h3 id="panel-title" class="bungee text-3xl">PANEL</h3>
                <button onclick="togglePanel()" class="h-12 w-12 glass rounded-full flex items-center justify-center"><i data-lucide="x"></i></button>
            </div>

            <div id="owner-tools" class="hidden space-y-6">
                <div class="p-6 glass border-yellow-500/20">
                    <p class="bungee text-[10px] text-yellow-500 mb-4">SYSTEM HEALTH</p>
                    <div class="flex justify-between text-xs font-bold"><span>DATABASE</span><span class="text-green-500">OPTIMAL</span></div>
                </div>
                <button class="w-full py-4 glass text-left px-6 bungee text-xs hover:bg-white hover:text-black transition-all">MANAGE ALL GROUPS</button>
                <button class="w-full py-4 glass text-left px-6 bungee text-xs hover:bg-white hover:text-black transition-all">USER BLACKLIST</button>
                <button class="w-full py-4 glass text-left px-6 bungee text-xs hover:bg-red-500 hover:text-white transition-all">WIPE SYSTEM DATA</button>
            </div>

            <div id="staff-tools" class="hidden space-y-6">
                <button class="w-full py-4 glass text-left px-6 bungee text-xs">MODERATE CHATS</button>
                <button class="w-full py-4 glass text-left px-6 bungee text-xs">REPORT LOGS</button>
            </div>
        </aside>

    </main>

    <script>
        lucide.createIcons();
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
