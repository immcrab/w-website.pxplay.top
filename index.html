<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
    </script>

    <style>
        :root { --accent: #a78bfa; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; }
        .ultra-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; }
        .btn-main { transition: 0.2s; font-family: 'Bungee', cursive; border-radius: 8px; text-transform: uppercase; }
        .btn-main:hover { transform: scale(1.02); background: white; color: black; }
        .hidden { display: none !important; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; outline: none; }
        .chat-tab { cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
        .chat-tab.active { background: rgba(255,255,255,0.05); border-left-color: var(--accent); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 flex justify-between items-center">
        <div onclick="showSection('home')" class="text-3xl font-black italic cursor-pointer">W<span class="text-purple-500">.</span></div>
        <button onclick="toggleModal('login-modal')" id="user-btn" class="ultra-glass px-6 py-2 text-[10px] font-bold uppercase tracking-widest">Sign In</button>
    </nav>

    <section id="home-sec" class="pt-20 px-6 max-w-4xl mx-auto">
        <div class="ultra-glass p-10 mb-10 border-purple-500/20 text-center">
            <h1 id="news-title" class="text-4xl font-['Bungee'] mb-2 italic">NETWORK ONLINE</h1>
            <p id="news-content" class="text-gray-400 text-sm">System is live. Use the hub to access private text channels.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div onclick="showSection('hub')" class="ultra-glass p-10 cursor-pointer hover:border-purple-500/40 transition">
                <h2 class="text-xl font-['Bungee']">ENTER HUB</h2>
                <p class="text-[9px] text-gray-500 uppercase mt-2">Secure Messaging</p>
            </div>
            <a href="https://wwebsite.sell.app" target="_blank" class="ultra-glass p-10 hover:border-cyan-500/40 transition">
                <h2 class="text-xl font-['Bungee']">OFFICIAL STORE</h2>
                <p class="text-[9px] text-gray-500 uppercase mt-2">Subscriptions</p>
            </a>
        </div>
    </section>

    <section id="hub-sec" class="hidden pt-10 px-6 max-w-6xl mx-auto h-[80vh]">
        <div class="grid grid-cols-4 gap-6 h-full">
            <div class="col-span-1 ultra-glass p-4 overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[9px] font-black text-gray-500 uppercase">Sessions</span>
                    <button onclick="toggleModal('join-modal')" class="text-purple-500 font-bold">+</button>
                </div>
                <div id="session-list" class="space-y-1"></div>
            </div>
            <div class="col-span-3 ultra-glass flex flex-col relative overflow-hidden">
                <div id="hub-overlay" class="absolute inset-0 bg-black/90 z-20 flex items-center justify-center">
                    <p class="text-[10px] font-['Bungee'] text-gray-600">Select a Session</p>
                </div>
                <div class="p-4 border-b border-white/5 text-xs font-bold text-gray-500" id="chat-header">#---</div>
                <div id="messages" class="flex-1 p-6 overflow-y-auto space-y-4"></div>
                <div class="p-4 border-t border-white/5 flex gap-2">
                    <input type="text" id="m-input" placeholder="Message..." class="flex-1">
                    <button onclick="sendMsg()" class="bg-white text-black px-6 rounded-lg text-[10px] font-bold">SEND</button>
                </div>
            </div>
        </div>
    </section>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center">
        <div class="ultra-glass p-10 w-80 text-center">
            <h2 class="font-['Bungee'] mb-6">LOGIN</h2>
            <input type="email" id="email-in" placeholder="Email" class="w-full mb-6">
            <button onclick="handleAuth()" class="w-full bg-white text-black py-3 rounded text-[10px] font-bold">ENTER</button>
        </div>
    </div>

    <div id="join-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center">
        <div class="ultra-glass p-10 w-80 text-center">
            <h2 class="font-['Bungee'] mb-6">JOIN CHAT</h2>
            <input type="text" id="code-in" placeholder="CODE" class="w-full mb-4 uppercase">
            <button onclick="createSession()" class="w-full bg-purple-600 py-3 rounded text-[10px] font-bold">JOIN</button>
            <button onclick="toggleModal('join-modal')" class="mt-4 text-[9px] text-gray-600">CANCEL</button>
        </div>
    </div>

    <div id="owner-panel" class="hidden fixed inset-0 bg-black z-[200] p-10">
        <h2 class="text-3xl font-['Bungee'] text-purple-500 mb-10">OWNER CONSOLE</h2>
        <div class="ultra-glass p-8 max-w-lg">
            <input type="text" id="o-title" placeholder="New News Title" class="w-full mb-4">
            <textarea id="o-body" placeholder="New News Content" class="w-full bg-white/5 border border-white/10 rounded-lg p-3 mb-4 h-24 text-white"></textarea>
            <button onclick="pushUpdate()" class="w-full bg-purple-600 py-4 rounded text-[10px] font-bold">UPDATE HOME</button>
        </div>
        <button onclick="toggleModal('owner-panel')" class="mt-10 text-gray-500">EXIT</button>
    </div>

    <script>
        let user = ""; let loggedIn = false; let sessions = []; let activeId = null; let isOwner = false;

        function showSection(id) {
            document.getElementById('home-sec').classList.toggle('hidden', id !== 'home');
            document.getElementById('hub-sec').classList.toggle('hidden', id !== 'hub');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function handleAuth() {
            user = document.getElementById('email-in').value;
            if(!user) return;
            loggedIn = true;
            if(user === "wwebsiteofficial@outlook.com") isOwner = true;
            document.getElementById('user-btn').innerText = user.split('@')[0].toUpperCase();
            toggleModal('login-modal');
        }

        function createSession() {
            const code = document.getElementById('code-in').value.toUpperCase();
            if(!code) return;
            sessions.push({ id: code, msgs: [] });
            toggleModal('join-modal');
            renderSidebar();
            selectSession(code);
        }

        function renderSidebar() {
            const list = document.getElementById('session-list');
            list.innerHTML = sessions.map(s => `
                <div onclick="selectSession('${s.id}')" class="chat-tab p-3 text-[10px] font-bold ${activeId === s.id ? 'active' : ''}">
                    #${s.id}
                </div>
            `).join('');
        }

        function selectSession(id) {
            activeId = id;
            document.getElementById('hub-overlay').classList.add('hidden');
            document.getElementById('chat-header').innerText = "#" + id;
            renderMessages();
            renderSidebar();
        }

        function sendMsg() {
            const input = document.getElementById('m-input');
            if(!input.value || !activeId) return;
            const session = sessions.find(s => s.id === activeId);
            session.msgs.push({ u: user.split('@')[0], t: input.value });
            input.value = "";
            renderMessages();
        }

        function renderMessages() {
            const feed = document.getElementById('messages');
            const session = sessions.find(s => s.id === activeId);
            feed.innerHTML = session.msgs.map(m => `
                <div class="bg-white/5 p-3 rounded-lg border border-white/5 max-w-[90%]">
                    <p class="text-[8px] text-purple-400 font-black mb-1 uppercase">${m.u}</p>
                    <p class="text-xs text-gray-200">${m.t}</p>
                </div>
            `).join('');
            feed.scrollTop = feed.scrollHeight;
        }

        function pushUpdate() {
            document.getElementById('news-title').innerText = document.getElementById('o-title').value;
            document.getElementById('news-content').innerText = document.getElementById('o-body').value;
            alert("Updated.");
            toggleModal('owner-panel');
        }

        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(keys['l'] && keys['p'] && isOwner) toggleModal('owner-panel');
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);
    </script>
</body>
</html>
