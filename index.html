<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W 2.0 | Master Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Bungee&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --clay-purple: #7c3aed;
            --clay-shadow: #5b21b6;
            --clay-light: #a78bfa;
            --bg-dark: #09090b;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 2px 2px, #1e1e24 1px, transparent 0);
            background-size: 40px 40px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- UI ELEMENTS --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
        }

        .squish-btn {
            background: var(--clay-purple);
            border-radius: 24px;
            box-shadow: inset 4px 4px 10px var(--clay-light), inset -4px -4px 10px var(--clay-shadow), 0 10px 20px rgba(124, 58, 237, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Bungee', cursive;
            border: none;
        }

        .squish-btn:active { transform: scale(0.92); }

        /* --- COMING SOON STYLING --- */
        .coming-soon-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .group:hover .coming-soon-overlay { opacity: 1; }

        /* --- SECURITY --- */
        .hidden-section { display: none; }
        .vault-blur { filter: blur(40px); transition: filter 0.3s; }
        @media print { body { display: none !important; } }

        .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <nav class="fixed top-6 left-0 right-0 z-50 px-6">
        <div class="max-w-5xl mx-auto glass-card py-4 px-8 flex justify-between items-center">
            <div id="main-logo" class="text-3xl font-black italic tracking-tighter text-purple-500 cursor-pointer">W.</div>
            <div class="hidden md:flex gap-8 text-[11px] font-black uppercase tracking-[0.2em] text-gray-400">
                <a href="#hub" class="hover:text-white transition">Hub</a>
                <a href="#store" class="hover:text-white transition">Store</a>
                <a href="#team" class="hover:text-white transition">Crew</a>
            </div>
            <div id="user-status" class="text-[10px] font-black text-gray-500 tracking-widest uppercase">GUEST_MODE</div>
        </div>
    </nav>

    <header class="min-h-screen flex flex-col items-center justify-center text-center px-6">
        <h1 class="text-7xl md:text-9xl font-['Bungee'] mb-4 reveal">W WEBSITE</h1>
        <p class="text-gray-500 font-bold tracking-[0.5em] mb-12 reveal">VIRTUAL • PLAYFUL • SECURE</p>
        <div class="reveal">
            <p class="text-xs text-gray-600 animate-pulse">Press [ L + P ] to initiate Staff Link</p>
        </div>
    </header>

    <section id="login-portal" class="py-20 flex justify-center hidden-section">
        <div class="w-full max-w-md glass-card p-10 border-purple-500/50">
            <h2 class="text-3xl font-['Bungee'] mb-6">STAFF ACCESS</h2>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Work Email" class="w-full bg-white/5 border-2 border-transparent focus:border-purple-500 rounded-2xl p-4 outline-none transition">
                <input type="password" id="password" placeholder="Keycode" class="w-full bg-white/5 border-2 border-transparent focus:border-purple-500 rounded-2xl p-4 outline-none transition">
                <button id="loginBtn" class="w-full squish-btn py-5">VERIFY ACCOUNT</button>
            </div>
        </div>
    </section>

    <section id="hub" class="py-32 px-6 max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 reveal">
            <div class="glass-card p-10 relative group overflow-hidden">
                <div class="text-5xl mb-4">💬</div>
                <h3 class="text-2xl font-black">TEXT</h3>
                <div class="coming-soon-overlay font-['Bungee'] text-purple-400">COMING SOON</div>
            </div>
            <div class="glass-card p-10 relative group overflow-hidden">
                <div class="text-5xl mb-4">🎮</div>
                <h3 class="text-2xl font-black">GAMES</h3>
                <div class="coming-soon-overlay font-['Bungee'] text-cyan-400">COMING SOON</div>
            </div>
            <div class="glass-card p-10 relative group overflow-hidden">
                <div class="text-5xl mb-4">🔗</div>
                <h3 class="text-2xl font-black">SOCIALS</h3>
                <div class="coming-soon-overlay font-['Bungee'] text-red-400">COMING SOON</div>
            </div>
        </div>
    </section>

    <section id="vault-section" class="py-32 px-6 hidden-section bg-red-600/5">
        <div class="max-w-2xl mx-auto vault-content">
            <div id="vault-card" class="glass-card p-12 border-red-500/40 text-center">
                <h2 class="text-5xl font-['Bungee'] text-red-600 mb-6">THE VAULT</h2>
                <button class="squish-btn bg-red-600 px-10 py-5 w-full">INITIALIZE MASTER SCAN</button>
            </div>
        </div>
    </section>

    <script type="module">
        // 1. AUTH LOGIC
        const ownerEmail = "wwebsiteofficial@outlook.com";
        
        // GHOST KEY HANDSHAKE (L + P)
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (keys['l'] && keys['p']) {
                document.getElementById('login-portal').classList.remove('hidden-section');
                document.getElementById('login-portal').scrollIntoView({ behavior: 'smooth' });
            }
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);

        // LOGIN EXECUTION
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            if (email === ownerEmail) {
                document.getElementById('user-status').innerText = "OWNER_AUTHORIZED";
                document.getElementById('user-status').style.color = "#a78bfa";
                document.getElementById('vault-section').classList.remove('hidden-section');
                alert("Welcome back, Boss. Vault Unlocked.");
            } else {
                document.getElementById('user-status').innerText = "STAFF_VERIFIED";
                alert("Staff Identity Confirmed.");
            }
        });

        // 2. SECURITY PROTOCOLS
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && ['c','v','s','p','i'].includes(e.key.toLowerCase())) {
                e.preventDefault();
                document.body.style.background = "#450a0a";
                setTimeout(() => document.body.style.background = "#09090b", 200);
            }
        });

        // 3. SCROLL REVEALS
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
