<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W-SUITE // VERSION 25</title>
    <style>
        /* =========================================================
           W-SUITE V25 :: DESIGN SYSTEM TOKENS
           ========================================================= */
        :root {
            /* Core Canvas */
            --bg-canvas: #030305;
            --bg-panel: #0c0c12;
            --border-thin: #1a1a26;
            
            /* Typography */
            --text-main: #ffffff;
            --text-muted: #8a8a9e;
            
            /* Accents */
            --accent-gold: #d4af37;
            --accent-purple: #7e22ce;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --glass-bg: rgba(12, 12, 18, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================================================
           1. THE PERFECT SPACIOUS FLEX HEADER
           ========================================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-canvas);
            border-bottom: 1px solid var(--border-thin);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-w {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text { font-size: 1.1rem; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; }

        /* Auth UI */
        .auth-block { position: relative; }
        .btn-login {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-thin);
            padding: 10px 24px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            border-color: var(--text-main);
            background: rgba(255,255,255,0.05);
        }
        
        .user-profile {
            display: none;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent-purple); background: var(--bg-panel); display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .dropdown {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border-thin);
            width: 200px;
            border-radius: 4px;
            padding: 10px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .user-profile:hover .dropdown { display: block; }
        .dropdown-item { padding: 12px 20px; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; display: block; transition: 0.2s; }
        .dropdown-item:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }

        /* =========================================================
           CORE LAYOUT CONTAINERS
           ========================================================= */
        main { flex: 1; padding: 3rem 4rem 4rem 4rem; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }

        /* PREMIUM W-MESSAGES INTERFACE */
        .chat-container {
            background: var(--bg-panel);
            border: 1px solid var(--border-thin);
            flex: 1;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .chat-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-thin);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.01);
        }
        .chat-title-area h2 { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        .chat-title-area p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .status-pill { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 4px 12px; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; border-radius: 2px; }
        
        .chat-messages {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background: radial-gradient(circle at top right, rgba(126, 34, 206, 0.03), transparent);
        }
        .message-wrapper { display: flex; flex-direction: column; max-width: 70%; gap: 4px; }
        .message-wrapper.self { align-self: flex-end; }
        .msg-meta { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.5px; }
        .message-wrapper.self .msg-meta { align-self: flex-end; }
        .msg-bubble {
            background: #12121a;
            border: 1px solid var(--border-thin);
            padding: 14px 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e2e9;
        }
        .message-wrapper.self .msg-bubble {
            background: var(--accent-purple);
            border-color: transparent;
            color: #ffffff;
        }

        .chat-input-area {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border-thin);
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.2);
        }
        .chat-input-area input {
            flex: 1;
            background: var(--bg-canvas);
            border: 1px solid var(--border-thin);
            color: #fff;
            padding: 15px 20px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-area input:focus { border-color: var(--accent-purple); }
        .btn-chat-send {
            background: var(--text-main);
            color: var(--bg-canvas);
            border: none;
            padding: 0 35px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-chat-send:hover { background: var(--accent-purple); color: #fff; }
        
        .auth-gate-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.95); backdrop-filter: blur(12px);
            z-index: 10; display: flex; justify-content: center; align-items: center;
            text-align: center; font-size: 1rem; color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* =========================================================
           SYSTEM INTERCEPTOR OVERLAYS
           ========================================================= */
        #system-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999; justify-content: center; align-items: center; flex-direction: column; text-align: center;
        }
        .overlay-card {
            background: var(--bg-panel); border: 1px solid var(--accent-red); padding: 4rem;
            max-width: 600px; box-shadow: 0 0 50px rgba(239, 68, 68, 0.1);
        }
        .overlay-card h2 { font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div id="system-overlay">
        <div id="overlay-content" class="overlay-card"></div>
    </div>

    <header>
        <div class="logo-block">
            <span class="logo-w">W</span>
            <span class="logo-text">Wwebsite // V25</span>
        </div>

        <div class="auth-block">
            <button class="btn-login" id="login-btn" onclick="triggerLoginModal()">Login / Sign Up</button>
            
            <div class="user-profile" id="user-profile-ui">
                <div class="avatar" id="user-avatar-initial">U</div>
                <div class="dropdown">
                    <a href="#" class="dropdown-item">⚙️ Account Settings</a>
                    <a href="#" class="dropdown-item" onclick="triggerLogout()">🚪 Disconnect</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="chat-container">
            
            <div id="chat-auth-gate" class="auth-gate-overlay">
                <div>Authenticate your session above to access transmissions</div>
            </div>

            <div class="chat-header">
                <div class="chat-title-area">
                    <h2>W-Messages // Core Grid</h2>
                    <p id="chat-notification-indicator">Realtime communication stream active.</p>
                </div>
                <div class="status-pill">Encrypted Connection</div>
            </div>

            <div class="chat-messages" id="chat-display">
                </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input-field" placeholder="Transmit a message to the master channel..." onkeydown="if(event.key === 'Enter') broadcastMessage()">
                <button class="btn-chat-send" onclick="broadcastMessage()">Send</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSy_MOCK_KEY_FOR_W_WEBSITE",
            authDomain: "wwebsite-v25.firebaseapp.com",
            databaseURL: "https://wwebsite-v25-default-rtdb.firebaseio.com",
            projectId: "wwebsite-v25"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const rtdb = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let currentSessionUser = null;

        window.triggerLoginModal = function() {
            signInWithPopup(auth, provider).catch(error => console.error("Auth Exception:", error.message));
        }

        window.triggerLogout = function() { signOut(auth); }

        // --- AUTHENTICATION & MESSAGING ACCESS CONTEXT ---
        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const profileUI = document.getElementById('user-profile-ui');
            const avatarTxt = document.getElementById('user-avatar-initial');
            const authGate = document.getElementById('chat-auth-gate');

            if (user) {
                currentSessionUser = user;
                loginBtn.style.display = 'none';
                profileUI.style.display = 'flex';
                avatarTxt.innerText = (user.displayName || user.email || 'U').charAt(0).toUpperCase();
                authGate.style.display = 'none'; 
                
                set(ref(rtdb, `users/${user.uid}/lastActive`), Date.now());
                set(ref(rtdb, `users/${user.uid}/email`), user.email);
            } else {
                currentSessionUser = null;
                loginBtn.style.display = 'block';
                profileUI.style.display = 'none';
                authGate.style.display = 'flex'; 
            }
        });

        // --- W-MESSAGES ENGINE SYSTEM ---
        window.broadcastMessage = function() {
            const inputField = document.getElementById('chat-input-field');
            const text = inputField.value.trim();
            if (!text || !currentSessionUser) return;

            push(ref(rtdb, 'messages'), {
                senderId: currentSessionUser.uid,
                senderName: currentSessionUser.displayName || currentSessionUser.email,
                senderEmail: currentSessionUser.email,
                message: text,
                timestamp: Date.now()
            }).then(() => {
                inputField.value = '';
                
                push(ref(rtdb, 'notification_queue/unread_logs'), {
                    recipientTrigger: "all-network",
                    senderEmail: currentSessionUser.email,
                    excerpt: text.substring(0, 60),
                    processed: false,
                    timestamp: Date.now()
                });
            });
        }

        onValue(ref(rtdb, 'messages'), (snapshot) => {
            const display = document.getElementById('chat-display');
            display.innerHTML = '';
            
            if(snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const isSelf = currentSessionUser && data.senderId === currentSessionUser.uid;
                    
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('message-wrapper');
                    if(isSelf) wrapper.classList.add('self');

                    wrapper.innerHTML = `
                        <div class="msg-meta">${data.senderName} • ${new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        <div class="msg-bubble">${data.message}</div>
                    `;
                    display.appendChild(wrapper);
                });
                display.scrollTop = display.scrollHeight;
            } else {
                display.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding-top:4rem; font-size:0.85rem; letter-spacing:1px;">GRID TIMELINE CLEAR — TRANSMIT NEXT GENERATION FREQUENCY</div>';
            }
        });

        // --- GLOBAL SECURITY INTERCEPTORS ---
        let initialLoad = true;
        onValue(ref(rtdb, 'system/globalReset'), (snapshot) => {
            if (initialLoad) { initialLoad = false; return; }
            if (snapshot.exists()) { window.location.reload(); }
        });

        onValue(ref(rtdb, 'system/status'), (snapshot) => {
            const status = snapshot.val();
            const overlay = document.getElementById('system-overlay');
            const content = document.getElementById('overlay-content');

            overlay.style.display = 'none';
            overlay.style.background = 'rgba(0,0,0,0.95)';
            content.style.borderColor = 'var(--border-thin)';

            if (status === "SHUTDOWN") {
                overlay.style.display = 'flex';
                overlay.style.background = '#000000'; 
                content.style.borderColor = 'var(--accent-red)';
                content.innerHTML = `<h2 style="color:var(--accent-red)">System Offline</h2><p>W-Suite System Offline — Operations Terminated by Executive Command.</p>`;
            } 
            else if (status === "UPDATING") {
                overlay.style.display = 'flex';
                content.style.borderColor = 'var(--accent-gold)';
                content.innerHTML = `<h2 style="color:var(--accent-gold)">Maintenance Node Active</h2><p>Wwebsite is currently updating platform dependencies. Please stand by.</p>`;
            } 
            else if (status === "TESTING") {
                setTimeout(() => {
                    const currentUser = auth.currentUser;
                    if (!currentUser || currentUser.email !== "brodywilliams0226@gmail.com") {
                        overlay.style.display = 'flex';
                        content.style.borderColor = 'var(--accent-purple)';
                        content.innerHTML = `<h2 style="color:var(--accent-purple)">Restricted Access</h2><p>Closed Staging Beta. Master Command authorization required.</p>`;
                    }
                }, 1000); 
            }
        });
    </script>
</body>
</html>
