<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W 2.0 | Owner Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #a78bfa;
            --blast: #ff4757;
            --bg: #050505;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Outfit', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            user-select: none;
            overflow-x: hidden;
        }

        /* --- MODERN UI --- */
        .ultra-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
        }

        .neon-border {
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
            border: 1px solid rgba(167, 139, 250, 0.4) !important;
        }

        .btn-squish {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            font-family: 'Bungee', cursive;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
        }

        .btn-squish:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .btn-squish:active { transform: scale(0.95); }

        /* --- OWNER UTILITIES --- */
        .hidden-panel { opacity: 0; pointer-events: none; transform: scale(0.95); transition: all 0.6s ease; display: none; }
        .show-panel { opacity: 1; pointer-events: auto; transform: scale(1); display: block; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
        .blast-active { animation: pulse-red 2s infinite; }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(167, 139, 250, 0.1);
            position: absolute;
            animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-8 left-0 right-0 z-50 px-6">
        <div class="max-w-4xl mx-auto ultra-glass py-4 px-10 flex justify-between items-center">
            <div class="text-3xl font-black tracking-tighter text-white">W<span class="text-purple-500">.</span></div>
            <div class="flex gap-10 items-center">
                <a href="https://wwebsite.sell.app" target="_blank" class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-400 hover:text-white transition">Store</a>
                <div id="status-orb" class="h-2 w-2 rounded-full bg-gray-600"></div>
            </div>
        </div>
    </nav>

    <main id="public-view" class="flex flex-col items-center justify-center min-h-screen text-center transition-all duration-700">
        <h1 class="text-8xl md:text-[12rem] font-black tracking-tighter mb-4 italic">W<span class="text-purple-600">.</span></h1>
        <p class="text-gray-500 font-light tracking-[1em] uppercase text-xs mb-10">Restricted Environment</p>
        <div class="bg-white/5 px-6 py-2 rounded-full text-[9px] font-bold text-gray-600 tracking-widest uppercase">
            Standby for System Handshake [L+P]
        </div>
    </main>

    <section id="owner-view" class="hidden-panel pt-32 pb-20 px-6 max-w-6xl mx-auto">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="ultra-glass p-8 relative overflow-hidden">
                <div class="scanline"></div>
                <p class="text-gray-500 text-[10px] font-black uppercase mb-2">Live Session</p>
                <h3 class="text-4xl font-black">ONLINE</h3>
            </div>
            <div class="ultra-glass p-8 neon-border">
                <p class="text-purple-400 text-[10px] font-black uppercase mb-2">Network Traffic</p>
                <h3 class="text-4xl font-black" id="user-count">24 <span class="text-sm font-light text-gray-500">Active</span></h3>
            </div>
            <div class="ultra-glass p-8">
                <p class="text-gray-500 text-[10px] font-black uppercase mb-2">Auth Level</p>
                <h3 class="text-4xl font-black text-purple-500 italic">OWNER</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="ultra-glass p-10 border-red-500/20">
                <div class="flex items-center gap-3 mb-8">
                    <div class="h-10 w-10 rounded-2xl bg-red-500/10 flex items-center justify-center text-red-500">📢</div>
                    <h2 class="text-2xl font-black">SYSTEM BLAST</h2>
                </div>
                <textarea id="blast-text" placeholder="Type global transmission..." class="w-full bg-white/5 border border-white/10 rounded-3xl p-6 outline-none h-40 text-sm mb-6 focus:border-red-500/50 transition-all"></textarea>
                <button id="trigger-blast" class="w-full btn-squish py-6 text-sm tracking-widest bg-red-600 hover:bg-red-500 blast-active">EXECUTE BLAST</button>
            </div>

            <div class="grid grid-cols-1 gap-6">
                <div class="ultra-glass p-10 flex justify-between items-center hover:bg-white/[0.04] cursor-pointer transition">
                    <div>
                        <h4 class="font-black text-lg">Staff Logs</h4>
                        <p class="text-gray-500 text-xs">Review all administrative actions.</p>
                    </div>
                    <div class="text-xl">➔</div>
                </div>
                <div class="ultra-glass p-10 flex justify-between items-center hover:bg-white/[0.04] cursor-pointer transition">
                    <div>
                        <h4 class="font-black text-lg">Vault Protection</h4>
                        <p class="text-gray-500 text-xs">Screenshot & Clipboard hardening.</p>
                    </div>
                    <div class="bg-green-500/20 text-green-500 text-[10px] px-3 py-1 rounded-full font-black">SECURE</div>
                </div>
                <div class="ultra-glass p-10 flex justify-between items-center border-red-900/40 hover:bg-red-900/10 cursor-pointer transition">
                    <h4 class="font-black text-lg text-red-500 uppercase italic">Emergency Lockdown</h4>
                </div>
            </div>
        </div>
    </section>

    <div id="visitor-alert" class="fixed top-12 left-1/2 -translate-x-1/2 z-[100] ultra-glass p-6 px-10 border-red-500/50 hidden translate-y-[-200%] transition-all duration-700">
        <div class="flex items-center gap-4">
            <div class="h-2 w-2 rounded-full bg-red-500 animate-ping"></div>
            <p id="alert-content" class="font-bold text-sm tracking-tight"></p>
        </div>
    </div>

    <script>
        // --- 1. THE SECRET HANDSHAKE ---
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (keys['l'] && keys['p']) {
                document.getElementById('public-view').style.display = 'none';
                const ownerView = document.getElementById('owner-view');
                ownerView.classList.remove('hidden-panel');
                ownerView.classList.add('show-panel');
                document.getElementById('status-orb').classList.replace('bg-gray-600', 'bg-purple-500');
                document.getElementById('status-orb').classList.add('animate-pulse');
            }
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);

        // --- 2. BLAST SYSTEM ---
        document.getElementById('trigger-blast').addEventListener('click', () => {
            const val = document.getElementById('blast-text').value;
            if(!val) return alert("Blast content required.");

            const alertBox = document.getElementById('visitor-alert');
            const alertText = document.getElementById('alert-content');

            alertText.innerText = val;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.remove('translate-y-[-200%]'), 100);

            // Hide after 10s
            setTimeout(() => {
                alertBox.classList.add('translate-y-[-200%]');
                setTimeout(() => alertBox.classList.add('hidden'), 700);
            }, 10000);
        });

        // --- 3. DYNAMIC USER COUNT (SPOOF) ---
        setInterval(() => {
            const count = Math.floor(Math.random() * (35 - 18 + 1)) + 18;
            document.getElementById('user-count').innerHTML = `${count} <span class="text-sm font-light text-gray-500">Active</span>`;
        }, 5000);

        // --- 4. HARDENED SECURITY ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && ['c','s','p','i'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
