<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index | Testing Mode</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #ffffff 0%, #dfe6e9 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #2d3436;
        }

        .card {
            text-align: center;
            background: #ffffff;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid #f1f2f6;
            width: 90%;
            max-width: 450px;
        }

        .status-badge {
            display: inline-block;
            background: #ffeaa7;
            color: #d63031;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        h1 { margin: 10px 0; font-weight: 800; font-size: 2rem; }
        p { color: #636e72; line-height: 1.6; margin-bottom: 20px; }

        /* Timer Styling */
        #timer {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0984e3;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .progress-container {
            width: 100%;
            background-color: #f1f2f6;
            border-radius: 10px;
            overflow: hidden;
            height: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: #0984e3;
            border-radius: 10px;
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">Testing Mode</div>
        <h1>Almost Ready</h1>
        <p>We are running final tests. The site will launch in:</p>
        
        <div id="timer">24:00:00</div>

        <div class="progress-container">
            <div id="bar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        // Set the duration: 24 hours in seconds
        let timeInSeconds = 24 * 60 * 60; 
        const display = document.querySelector('#timer');
        const progressBar = document.querySelector('#bar');
        const totalTime = timeInSeconds;

        const countdown = setInterval(() => {
            let hours = Math.floor(timeInSeconds / 3600);
            let minutes = Math.floor((timeInSeconds % 3600) / 60);
            let seconds = timeInSeconds % 60;

            // Add leading zeros
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            display.textContent = `${hours}:${minutes}:${seconds}`;

            // Update Progress Bar
            let progressWidth = (timeInSeconds / totalTime) * 100;
            progressBar.style.width = progressWidth + "%";

            if (timeInSeconds <= 0) {
                clearInterval(countdown);
                display.textContent = "00:00:00";
                display.style.color = "#00b894";
                document.querySelector('h1').textContent = "We are Live!";
            } else {
                timeInSeconds--;
            }
        }, 1000);
    </script>

</body>
</html>
