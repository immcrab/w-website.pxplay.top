<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W | The Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
    </script>

    <style>
        :root { --accent: #a78bfa; --bg: #030303; --glass: rgba(255, 255, 255, 0.02); }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        /* THE "W" IDENTITY */
        .w-hero {
            font-size: clamp(140px, 25vw, 260px);
            font-weight: 900;
            line-height: 0.75;
            letter-spacing: -14px;
            font-style: italic;
            background: linear-gradient(180deg, #fff 40%, rgba(255,255,255,0.02));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 50px rgba(167, 139, 250, 0.1));
        }

        .ultra-glass { 
            background: var(--glass); 
            backdrop-filter: blur(50px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 35px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* SQUISHY INTERACTION */
        .tile-btn { cursor: pointer; }
        .tile-btn:hover { 
            transform: scale(1.03) translateY(-8px) rotate(-1deg); 
            background: rgba(167, 139, 250, 0.05);
            border-color: var(--accent);
            box-shadow: 0 20px 40px -20px rgba(167, 139, 250, 0.3);
        }
        .tile-btn:active { transform: scale(0.96); }

        /* ALERT SYSTEM */
        .alert-marquee {
            background: #ff3333;
            color: black;
            font-family: 'Bungee';
            font-size: 11px;
            padding: 6px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 200;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
        
        input, textarea { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.05); 
            color: white; 
            padding: 20px; 
            border-radius: 20px; 
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.06); }

        .chat-msg { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .master-terminal { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    </style>
</head>
<body>

    <div id="announcement" class="alert-marquee hidden">
        <marquee scrollamount="12" id="announcement-text">NETWORK UPDATE: ELITE MEMBERSHIPS NOW LIVE VIA STORE</marquee>
    </div>

    <nav class="fixed top-0 left-0 right-0 z-[100] p-10 flex justify-between items-center">
        <div onclick="showSection('home')" class="text-4xl font-black italic tracking-tighter cursor-pointer">W<span class="text-purple-500">.</span></div>
        <button onclick="toggleModal('login-modal')" id="nav-btn" class="ultra-glass px-10 py-4 text-[10px] font-black uppercase tracking-[0.3em] hover:bg-white hover:text-black transition-all">Identify</button>
    </nav>

    <section id="home-sec" class="min-h-screen flex flex-col items-center justify-center text-center px-8">
        <div class="mb-28">
            <h1 class="w-hero">W</h1>
            <p id="net-status" class="text-[11px] font-black text-purple-400 uppercase tracking-[1.4em] ml-8 opacity-50">Operational_V4</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl mb-28">
            <div onclick="showSection('hub')" class="ultra-glass p-20 tile-btn group">
                <h2 class="text-4xl font-['Bungee'] group-hover:text-purple-400 transition">HUB</h2>
                <p class="text-[10px] text-gray-600 font-bold uppercase mt-3 tracking-widest">Encrypted Comms</p>
            </div>
            <a href="https://wwebsite.sell.app" target="_blank" class="ultra-glass p-20 tile-btn group">
                <h2 class="text-4xl font-['Bungee'] group-hover:text-cyan-400 transition">STORE</h2>
                <p class="text-[10px] text-gray-600 font-bold uppercase mt-3 tracking-widest">Official Tiers</p>
            </a>
        </div>

        <div class="max-w-3xl w-full ultra-glass p-16 border-white/5 mb-24">
            <h3 class="text-xl font-['Bungee'] mb-10 tracking-tighter">Support Transmission</h3>
            <div class="grid grid-cols-1 gap-5">
                <input type="text" id="s-name" placeholder="IDENTIFIER">
                <textarea id="s-msg" placeholder="MESSAGE CONTENT..." class="h-32"></textarea>
                <button onclick="transmit()" class="bg-white text-black w-full py-5 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-purple-500 hover:text-white transition">Broadcast</button>
            </div>
        </div>
    </section>

    <section id="hub-sec" class="hidden pt-36 pb-10 px-10 max-w-7xl mx-auto h-[92vh]">
        <div class="grid grid-cols-4 gap-8 h-full">
            <div class="col-span-1 ultra-glass p-8 flex flex-col gap-4 overflow-y-auto custom-scroll border-white/5">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[9px] font-black text-purple-400 uppercase tracking-widest">Active Links</span>
                    <button onclick="toggleModal('join-modal')" class="h-10 w-10 bg-white/5 rounded-full font-black hover:bg-purple-600 transition">+</button>
                </div>
                <div id="side-list" class="space-y-2"></div>
            </div>

            <div class="col-span-3 ultra-glass flex flex-col relative overflow-hidden">
                <div id="hub-lock" class="absolute inset-0 bg-black/95 z-20 flex items-center justify-center">
                    <p class="text-[11px] font-['Bungee'] text-gray-800 tracking-[0.6em] uppercase">Syncing Connection...</p>
                </div>
                <div class="p-8 border-b border-white/5 bg-white/[0.01]">
                    <h3 id="chat-head" class="font-black italic text-gray-400 tracking-tighter">#UNLINKED</h3>
                </div>
                <div id="msg-feed" class="flex-1 p-10 overflow-y-auto custom-scroll space-y-6"></div>
                <div class="p-8 border-t border-white/5 bg-white/[0.02] flex gap-5">
                    <input type="text" id="m-in" placeholder="Secure transmission...">
                    <button onclick="send()" class="bg-white text-black px-12 rounded-2xl font-black text-[11px]">SEND</button>
                </div>
            </div>
        </div>
    </section>

    <div id="master-console" class="hidden fixed inset-0 bg-black z-[500] p-16 overflow-y-auto">
        <div class="flex justify-between items-center mb-16">
            <h2 class="text-5xl font-['Bungee'] text-purple-500 italic tracking-tighter">W_ADMIN</h2>
            <button onclick="toggleModal('master-console')" class="text-gray-600 text-[10px] font-black uppercase tracking-widest">Terminate Session</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="ultra-glass p-12 border-purple-500/20">
                <h3 class="text-xs font-black mb-8 uppercase text-gray-500 tracking-widest">Override Controls</h3>
                <label class="block text-[10px] text-purple-400 mb-2">Headline</label>
                <input type="text" id="o-status" placeholder="Network Status" class="mb-6">
                <label class="block text-[10px] text-red-500 mb-2">Alert Banner</label>
                <input type="text" id="o-alert" placeholder="Broadcast Text" class="mb-8">
                <button onclick="saveAdmin()" class="bg-purple-600 w-full py-5 rounded-2xl font-black text-xs">PUSH TO NETWORK</button>
            </div>
            <div class="ultra-glass p-12 border-white/5">
                <h3 class="text-xs font-black mb-8 uppercase text-gray-500 tracking-widest">Transmission Log</h3>
                <div id="o-inbox" class="space-y-4 h-[400px] overflow-y-auto custom-scroll master-terminal"></div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/98 z-[600] flex items-center justify-center p-6">
        <div class="ultra-glass p-16 w-full max-w-sm text-center border-purple-500/10">
            <h2 class="text-3xl font-['Bungee'] mb-10 italic">IDENTIFY</h2>
            <input type="email" id="u-mail" placeholder="EMAIL@W.NET" class="mb-8">
            <button onclick="auth()" class="bg-white text-black w-full py-5 rounded-2xl font-black text-xs uppercase tracking-widest">Enter</button>
        </div>
    </div>

    <div id="join-modal" class="hidden fixed inset-0 bg-black/98 z-[600] flex items-center justify-center p-6">
        <div class="ultra-glass p-16 w-full max-w-sm text-center">
            <h2 class="text-2xl font-['Bungee'] mb-10">SYNC SESSION</h2>
            <input type="text" id="u-code" placeholder="CODE" class="text-center tracking-[0.8em] font-black mb-10 uppercase text-purple-400 text-2xl">
            <button onclick="join()" class="bg-purple-600 w-full py-5 rounded-2xl font-black text-xs uppercase">Connect</button>
        </div>
    </div>

    <script>
        let mail = ""; let logged = false; let sessions = []; let curId = null; let isBoss = false;

        function showSection(id) {
            if(id === 'hub' && !logged) { toggleModal('login-modal'); return; }
            document.getElementById('home-sec').classList.toggle('hidden', id !== 'home');
            document.getElementById('hub-sec').classList.toggle('hidden', id !== 'hub');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function auth() {
            mail = document.getElementById('u-mail').value; if(!mail) return;
            logged = true;
            if(mail === "wwebsiteofficial@outlook.com") isBoss = true;
            document.getElementById('nav-btn').innerText = mail.split('@')[0].toUpperCase();
            toggleModal('login-modal');
        }

        function join() {
            const code = document.getElementById('u-code').value.toUpperCase(); if(!code) return;
            if(!sessions.find(s => s.id === code)) sessions.push({ id: code, msgs: [] });
            toggleModal('join-modal');
            document.getElementById('u-code').value = "";
            renderList(); selectSession(code);
        }

        function renderList() {
            const list = document.getElementById('side-list');
            list.innerHTML = sessions.map(s => `
                <div onclick="selectSession('${s.id}')" class="chat-tab p-6 font-black text-xs ${curId === s.id ? 'active' : 'bg-white/[0.02]'}">
                    #${s.id}
                </div>
            `).join('');
        }

        function selectSession(id) {
            curId = id; document.getElementById('hub-lock').classList.add('hidden');
            document.getElementById('chat-head').innerText = "#" + id;
            renderMsgs(); renderList();
        }

        function send() {
            const i = document.getElementById('m-in'); if(!i.value || !curId) return;
            const s = sessions.find(x => x.id === curId);
            s.msgs.push({ u: mail.split('@')[0], t: i.value });
            i.value = ""; renderMsgs();
        }

        function renderMsgs() {
            const f = document.getElementById('msg-feed');
            const s = sessions.find(x => x.id === curId);
            f.innerHTML = s.msgs.map(m => `
                <div class="chat-msg bg-white/5 p-6 rounded-3xl border border-white/5 max-w-[85%]">
                    <p class="text-[9px] text-purple-400 font-black mb-2 uppercase italic">${m.u}</p>
                    <p class="text-sm text-gray-200">${m.t}</p>
                </div>
            `).join('');
            f.scrollTop = f.scrollHeight;
        }

        function transmit() {
            const n = document.getElementById('s-name').value; const m = document.getElementById('s-msg').value;
            if(!n || !m) return;
            const log = document.getElementById('o-inbox');
            const d = document.createElement('div');
            d.className = "p-5 ultra-glass mb-3 border-white/10 text-xs";
            d.innerHTML = `<span class="text-purple-400 font-black">[${n.toUpperCase()}]</span>: ${m}`;
            log.prepend(d);
            alert("Transmission Sent.");
            document.getElementById('s-name').value = ""; document.getElementById('s-msg').value = "";
        }

        function saveAdmin() {
            const status = document.getElementById('o-status').value;
            const alertText = document.getElementById('o-alert').value;
            if(status) document.getElementById('net-status').innerText = status;
            if(alertText) {
                document.getElementById('announcement').classList.remove('hidden');
                document.getElementById('announcement-text').innerText = alertText;
            } else {
                document.getElementById('announcement').classList.add('hidden');
            }
            toggleModal('master-console');
        }

        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(keys['l'] && keys['p'] && isBoss) toggleModal('master-console');
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);
    </script>
</body>
</html>
