<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>W Website | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Bungee&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .hidden-section { display: none; }
        .action-btn { background: white; color: black; font-weight: 900; letter-spacing: 2px; transition: 0.3s; border-radius: 12px; }
        .action-btn:hover { transform: scale(1.05); background: #a855f7; color: white; }
        #loader { fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center transition-opacity duration-500; }
        .google-btn { background: white; color: #444; width: 100%; padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .google-btn:hover { background: #f1f1f1; }
    </style>
</head>
<body>

    <div id="loader" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-['Bungee'] text-[10px] tracking-widest text-purple-500">SYSTEM ONLINE</p>
    </div>

    <nav class="fixed top-4 left-0 right-0 z-50 px-4 reveal">
        <div class="max-w-5xl mx-auto glass-card py-3 px-6 flex justify-between items-center rounded-full">
            <div class="text-xl font-black italic text-purple-500">W.</div>
            <div class="flex gap-5 text-[9px] font-bold uppercase tracking-widest text-gray-400">
                <a href="#hub">Hub</a>
                <a href="#team-section" id="team-link" class="hidden text-purple-400">Team</a>
                <a href="#vault" id="vault-link" class="hidden text-red-500">Vault</a>
            </div>
        </div>
    </nav>

    <header class="h-screen flex flex-col items-center justify-center text-center px-6 reveal">
        <h1 class="text-6xl md:text-8xl font-['Bungee'] leading-none">W WEBSITE</h1>
        <p class="text-gray-500 text-[10px] md:text-sm font-bold tracking-[0.4em] mt-4 mb-12 uppercase">Professional • Secure • Modern</p>
        <a href="#login-section" class="action-btn px-10 py-5 text-sm">STAFF LOGIN</a>
    </header>

    <section id="login-section" class="py-20 px-4 flex justify-center reveal">
        <div class="w-full max-w-md glass-card p-10 rounded-[35px]">
            <h2 class="text-xl font-['Bungee'] mb-6 text-center">STAFF ACCESS</h2>
            
            <div id="googleBtn" class="google-btn mb-6">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18" alt="">
                <span>Sign in with Google</span>
            </div>

            <div class="flex items-center gap-4 mb-6 opacity-20">
                <hr class="flex-1 border-white/20">
                <span class="text-[10px] font-bold">OR</span>
                <hr class="flex-1 border-white/20">
            </div>

            <input type="email" id="email" placeholder="Staff Email" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 mb-4 outline-none text-sm focus:border-purple-500">
            <input type="password" id="pass" placeholder="Master Key" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 mb-6 outline-none text-sm focus:border-purple-500">
            <button id="loginBtn" class="w-full action-btn py-4">MANUAL LOGIN</button>
        </div>
    </section>

    <section id="team-section" class="py-20 px-4 hidden-section reveal">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl font-['Bungee'] mb-12 text-purple-500">OPERATIONAL TEAM</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="glass-card p-8 rounded-3xl border-purple-500/20">
                    <div class="text-4xl mb-4">🛡️</div>
                    <h3 class="text-xl font-black">Owen Lee</h3>
                    <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest">System Architect</p>
                </div>
                <div class="glass-card p-8 rounded-3xl border-purple-500/20">
                    <div class="text-4xl mb-4">⚡</div>
                    <h3 class="text-xl font-black">Brody Williams</h3>
                    <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest">Lead Developer</p>
                </div>
            </div>
        </div>
    </section>

    <section id="vault" class="py-20 px-4 hidden-section reveal">
        <div class="max-w-2xl mx-auto glass-card p-12 border-red-500/30 rounded-[40px] text-center">
            <h2 class="text-4xl font-['Bungee'] text-red-500 mb-6">THE VAULT</h2>
            <div class="bg-black/40 p-6 rounded-2xl text-[10px] text-gray-500 italic mb-8">
                Master Authority Level 10 Detected.
            </div>
            <button class="action-btn bg-red-600 px-8 py-4 mx-auto text-white">MANAGE SYSTEM</button>
        </div>
    </section>

    <script>
        // Loader Logic
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => { 
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; handleScrollReveal(); }, 500);
            }, 1000);
        });

        // Scroll Reveal Logic
        function handleScrollReveal() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight - 50) el.classList.add('active');
            });
        }
        window.addEventListener('scroll', handleScrollReveal);

        // Google Sign In - "Not Working" Logic
        document.getElementById('googleBtn').addEventListener('click', () => {
            alert("Error 403: Google OAuth Bridge Disconnected. Please use Manual Login.");
        });

        // Login & Team Display Logic
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            
            if (email.length > 3) {
                // Show Team Section
                document.getElementById('team-section').classList.remove('hidden-section');
                document.getElementById('team-section').classList.add('active');
                document.getElementById('team-link').classList.remove('hidden');
                
                // If owner email, show vault too
                if (email === "wwebsiteofficial@outlook.com") {
                    document.getElementById('vault').classList.remove('hidden-section');
                    document.getElementById('vault').classList.add('active');
                    document.getElementById('vault-link').classList.remove('hidden');
                    alert("Owner Access: Team & Vault Unlocked.");
                } else {
                    alert("Staff Access: Team Directory Unlocked.");
                }

                // Scroll to Team
                document.getElementById('team-section').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Please enter a valid Staff Email.");
            }
        });
    </script>
</body>
</html>
