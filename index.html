<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
            authDomain: "makerlee.firebaseapp.com",
            databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
            projectId: "makerlee",
            storageBucket: "makerlee.firebasestorage.app",
            messagingSenderId: "730881046345",
            appId: "1:730881046345:web:bf0fb8862db08de7604c98",
            measurementId: "G-GRQ0L4H0Y6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
    </script>

    <style>
        :root { --accent: #a78bfa; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        .ultra-glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 25px; 
        }

        .w-logo {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -10px;
            font-style: italic;
            background: linear-gradient(to bottom, #fff 30%, rgba(255,255,255,0.1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -40px;
        }

        .btn-main { transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-family: 'Bungee', cursive; }
        .btn-main:hover { transform: translateY(-5px); filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.4)); }
        
        .hidden { display: none !important; }
        
        input, textarea { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            padding: 15px; 
            border-radius: 15px; 
            outline: none; 
            width: 100%;
        }

        .chat-tab { cursor: pointer; transition: 0.3s; border-radius: 15px; border: 1px solid transparent; }
        .chat-tab.active { background: rgba(167, 139, 250, 0.1); border-color: var(--accent); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="fixed top-0 left-0 right-0 z-[100] p-8 flex justify-between items-center">
        <div onclick="showSection('home')" class="text-3xl font-black italic cursor-pointer">W<span class="text-purple-500">.</span></div>
        <button onclick="toggleModal('login-modal')" id="nav-btn" class="ultra-glass px-8 py-3 text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-black transition">Sign In</button>
    </nav>

    <section id="home-sec" class="flex flex-col items-center justify-center min-h-screen text-center px-6">
        <div>
            <h1 class="w-logo">W</h1>
            <p id="home-news-title" class="text-[10px] font-black text-purple-500 uppercase tracking-[1em] mb-20 ml-4 italic">Network Online</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
            <div onclick="showSection('hub')" class="ultra-glass p-16 cursor-pointer btn-main group">
                <h2 class="text-3xl font-['Bungee'] group-hover:text-purple-400 transition">HUB</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mt-2 tracking-widest">Secure Messaging</p>
            </div>
            <a href="https://wwebsite.sell.app" target="_blank" class="ultra-glass p-16 btn-main group">
                <h2 class="text-3xl font-['Bungee'] group-hover:text-cyan-400 transition">STORE</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase mt-2 tracking-widest">Official Shop</p>
            </a>
        </div>

        <div class="mt-20 max-w-lg w-full ultra-glass p-10 border-white/5">
            <h3 class="text-sm font-['Bungee'] mb-6">SUPPORT TRANSITION</h3>
            <input type="text" id="sup-name" placeholder="Name" class="mb-4">
            <textarea id="sup-msg" placeholder="Message..." class="h-24 mb-4"></textarea>
            <button onclick="submitToOwner()" class="btn-main bg-white/5 border border-white/10 w-full py-4 text-[10px] font-black hover:bg-white hover:text-black">Send</button>
        </div>
    </section>

    <section id="hub-sec" class="hidden pt-32 pb-10 px-8 max-w-7xl mx-auto h-[90vh]">
        <div class="grid grid-cols-4 gap-8 h-full">
            <div class="col-span-1 ultra-glass p-6 flex flex-col gap-3 overflow-y-auto custom-scroll">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[11px] font-black text-gray-500 uppercase tracking-widest">Sessions</span>
                    <button onclick="toggleModal('join-modal')" class="font-bold text-purple-500">+</button>
                </div>
                <div id="session-list" class="space-y-2"></div>
            </div>

            <div class="col-span-3 ultra-glass flex flex-col relative overflow-hidden">
                <div id="hub-overlay" class="absolute inset-0 bg-black/90 backdrop-blur-3xl z-20 flex items-center justify-center">
                    <p class="text-[11px] font-['Bungee'] text-gray-600 tracking-widest italic">Identify Session to Connect</p>
                </div>
                <div class="p-8 border-b border-white/5 bg-white/[0.01]">
                    <h3 id="chat-header" class="font-black italic text-gray-500 text-sm">#---</h3>
                </div>
                <div id="messages" class="flex-1 p-10 overflow-y-auto custom-scroll space-y-6"></div>
                <div class="p-8 border-t border-white/5 flex gap-4">
                    <input type="text" id="m-input" placeholder="Transmission...">
                    <button onclick="sendMsg()" class="btn-main bg-white text-black px-12 rounded-xl text-[11px] font-black">SEND</button>
                </div>
            </div>
        </div>
    </section>

    <div id="owner-panel" class="hidden fixed inset-0 bg-black z-[500] p-12 overflow-y-auto">
        <h2 class="text-5xl font-['Bungee'] text-purple-500 mb-16 italic">MASTER_CONSOLE</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="ultra-glass p-10">
                <h3 class="text-[10px] font-black mb-6 uppercase tracking-widest">Update Home News</h3>
                <input type="text" id="o-title" placeholder="New Headline" class="mb-4">
                <button onclick="pushUpdate()" class="btn-main bg-purple-600 w-full py-4 text-[10px] font-black">Update Network</button>
            </div>
            <div class="ultra-glass p-10">
                <h3 class="text-[10px] font-black mb-6 uppercase tracking-widest">Support Inbox</h3>
                <div id="o-inbox" class="space-y-4 h-64 overflow-y-auto custom-scroll text-xs"></div>
            </div>
        </div>
        <button onclick="toggleModal('owner-panel')" class="mt-10 text-gray-600 underline">Exit Session</button>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/98 z-[600] flex items-center justify-center p-6">
        <div class="ultra-glass p-12 w-full max-w-sm text-center">
            <h2 class="text-3xl font-['Bungee'] mb-8">LOGIN</h2>
            <input type="email" id="email-in" placeholder="Email" class="mb-6">
            <button onclick="handleAuth()" class="btn-main w-full bg-white text-black py-5 rounded-xl text-[11px] font-black">ENTER</button>
        </div>
    </div>

    <div id="join-modal" class="hidden fixed inset-0 bg-black/98 z-[600] flex items-center justify-center p-6">
        <div class="ultra-glass p-12 w-full max-w-sm text-center">
            <h2 class="text-2xl font-['Bungee'] mb-10">JOIN SESSION</h2>
            <input type="text" id="code-in" placeholder="CODE" class="text-center tracking-widest font-black mb-10 uppercase text-purple-400">
            <button onclick="createSession()" class="btn-main w-full bg-purple-600 py-5 rounded-xl text-[11px] font-black">CONNECT</button>
        </div>
    </div>

    <script>
        let user = ""; let loggedIn = false; let sessions = []; let activeId = null; let isM = false;

        function showSection(id) {
            if(id === 'hub' && !loggedIn) { toggleModal('login-modal'); return; }
            document.getElementById('home-sec').classList.toggle('hidden', id !== 'home');
            document.getElementById('hub-sec').classList.toggle('hidden', id !== 'hub');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function handleAuth() {
            user = document.getElementById('email-in').value; if(!user) return;
            loggedIn = true;
            if(user === "wwebsiteofficial@outlook.com") isM = true;
            document.getElementById('nav-btn').innerText = user.split('@')[0].toUpperCase();
            toggleModal('login-modal');
        }

        function createSession() {
            const c = document.getElementById('code-in').value.toUpperCase(); if(!c) return;
            sessions.push({ id: c, msgs: [] });
            toggleModal('join-modal');
            document.getElementById('code-in').value = "";
            renderSidebar();
            selectSession(c);
        }

        function renderSidebar() {
            const l = document.getElementById('session-list');
            l.innerHTML = sessions.map(s => `
                <div onclick="selectSession('${s.id}')" class="chat-tab p-5 text-[11px] font-black ${activeId === s.id ? 'active' : 'bg-white/[0.02]'}">
                    #${s.id}
                </div>
            `).join('');
        }

        function selectSession(id) {
            activeId = id; document.getElementById('hub-overlay').classList.add('hidden');
            document.getElementById('chat-header').innerText = "#" + id;
            renderMessages(); renderSidebar();
        }

        function sendMsg() {
            const input = document.getElementById('m-input'); if(!input.value || !activeId) return;
            const s = sessions.find(x => x.id === activeId);
            s.msgs.push({ u: user.split('@')[0], t: input.value });
            input.value = ""; renderMessages();
        }

        function renderMessages() {
            const f = document.getElementById('messages');
            const s = sessions.find(x => x.id === activeId);
            f.innerHTML = s.msgs.map(m => `
                <div class="bg-white/5 p-5 rounded-2xl border border-white/5 max-w-[85%]">
                    <p class="text-[9px] text-purple-400 font-black mb-2 uppercase">${m.u}</p>
                    <p class="text-sm text-gray-200">${m.t}</p>
                </div>
            `).join('');
            f.scrollTop = f.scrollHeight;
        }

        function submitToOwner() {
            const n = document.getElementById('sup-name').value; const m = document.getElementById('sup-msg').value;
            if(!n || !m) return;
            const box = document.getElementById('o-inbox');
            const d = document.createElement('div');
            d.className = "p-4 bg-white/5 rounded-xl border border-white/10";
            d.innerHTML = `<p class="font-black text-purple-400 uppercase">${n}</p><p>${m}</p>`;
            box.prepend(d);
            alert("Transmission Sent.");
            document.getElementById('sup-name').value = ""; document.getElementById('sup-msg').value = "";
        }

        function pushUpdate() {
            document.getElementById('home-news-title').innerText = document.getElementById('o-title').value;
            toggleModal('owner-panel');
        }

        let k = {};
        document.addEventListener('keydown', e => { k[e.key.toLowerCase()] = true; if(k['l'] && k['p'] && isM) toggleModal('owner-panel'); });
        document.addEventListener('keyup', e => delete k[e.key.toLowerCase()]);
    </script>
</body>
</html>
