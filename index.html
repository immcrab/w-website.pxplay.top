<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website | AI Neural Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        // [Previous Firebase Imports Stay Here]
        
        // W-AI CONFIGURATION
        const GROQ_API_KEY = "PASTE_YOUR_NEW_KEY_HERE"; // Use your NEW key here safely

        window.askWBot = async () => {
            const input = document.getElementById('ai-input');
            const display = document.getElementById('ai-display');
            const loader = document.getElementById('ai-loader');
            const userMsg = input.value;

            if(!userMsg) return;

            // Update UI
            display.innerHTML += `<div class="mb-4 text-right"><span class="glass px-6 py-3 bungee text-[10px] text-purple-400">YOU: ${userMsg}</span></div>`;
            input.value = "";
            loader.classList.remove('hidden');

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [
                            {role: "system", content: "You are W-Bot, the official AI of W Website. You are high-tech, playful, and helpful."},
                            {role: "user", content: userMsg}
                        ]
                    })
                });

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                loader.classList.add('hidden');
                display.innerHTML += `<div class="mb-4"><span class="glass px-6 py-3 bungee text-[10px] text-cyan-400">W-BOT: ${aiReply}</span></div>`;
                display.scrollTop = display.scrollHeight;
            } catch (err) {
                loader.classList.add('hidden');
                display.innerHTML += `<div class="text-red-500 bungee text-[8px]">CONNECTION ERROR: CHECK API KEY</div>`;
            }
        };
    </script>

    <style>
        /* [Previous Styles Remain for Consistency] */
        .ai-chat-box { height: 500px; overflow-y: auto; scroll-behavior: smooth; }
        .ai-chat-box::-webkit-scrollbar { width: 0px; }
        
        .glow-ring {
            border: 2px solid transparent;
            border-top: 2px solid #a78bfa;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <section id="ai-page" class="page-view hidden min-h-screen pt-40 px-8">
        <div class="max-w-5xl mx-auto">
            <div class="glass p-12 relative overflow-hidden">
                <div class="absolute -top-20 -right-20 w-64 h-64 bg-purple-600/10 blur-[100px] rounded-full"></div>
                
                <div class="flex justify-between items-center mb-10">
                    <div>
                        <h2 class="text-6xl bungee italic">W-AI</h2>
                        <p class="bungee text-[9px] text-purple-400 tracking-[0.3em]">NEURAL BRIDGE ACTIVE</p>
                    </div>
                    <div id="ai-loader" class="hidden flex items-center gap-3">
                        <div class="glow-ring"></div>
                        <span class="bungee text-[8px] animate-pulse">THINKING...</span>
                    </div>
                </div>

                <div id="ai-display" class="ai-chat-box mb-8 p-6 bg-white/5 rounded-[30px] border border-white/5 flex flex-col">
                    <div class="mb-4">
                        <span class="glass px-6 py-3 bungee text-[10px] text-cyan-400">W-BOT: Connection established. How can I assist with the W Website today?</span>
                    </div>
                </div>

                <div class="flex gap-4">
                    <input id="ai-input" type="text" placeholder="Send a command to W-Bot..." 
                           class="flex-1 glass bg-white/5 px-8 py-5 bungee text-xs outline-none focus:border-purple-500/50 transition-all">
                    <button onclick="askWBot()" class="bg-white text-black px-10 rounded-[20px] bungee text-xs hover:scale-105 active:scale-95 transition-all">
                        SEND
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Update the showPage menu to include 'ai-page'
        // Add a button in your Nav called "AI" that triggers showPage('ai-page')
    </script>
</body>
</html>
