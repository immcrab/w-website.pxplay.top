<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Construction</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c10;
      --fg: #f0ece2;
      --accent: #c8a96e;
      --muted: #5a5750;
      --line: rgba(200,169,110,0.25);
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative horizontal rules */
    .rule-top, .rule-bottom {
      position: fixed;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }
    .rule-top { top: 48px; }
    .rule-bottom { bottom: 48px; }

    /* Corner marks */
    .corner {
      position: fixed;
      width: 24px; height: 24px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.5;
    }
    .corner.tl { top: 32px; left: 32px; border-width: 1px 0 0 1px; }
    .corner.tr { top: 32px; right: 32px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: 32px; left: 32px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: 32px; right: 32px; border-width: 0 1px 1px 0; }

    /* Main content */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 680px;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .label {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.5rem;
      animation: fadeUp 1s 0.1s both;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 0.2em;
      animation: fadeUp 1s 0.2s both;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 2rem auto;
      animation: expandWidth 1s 0.4s both;
    }

    .message {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      line-height: 2;
      margin-bottom: 3rem;
      animation: fadeUp 1s 0.5s both;
    }

    /* Pulsing status dot */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fadeUp 1s 0.7s both;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    /* Progress bar */
    .progress-wrap {
      margin: 2.5rem auto 0;
      width: 220px;
      height: 1px;
      background: var(--line);
      overflow: visible;
      position: relative;
      animation: fadeUp 1s 0.6s both;
    }

    .progress-bar {
      height: 1px;
      background: linear-gradient(90deg, var(--accent), #e8d5a3);
      width: 0;
      animation: fillBar 3s 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      right: 0; top: 50%;
      transform: translateY(-50%);
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #e8d5a3;
      box-shadow: 0 0 8px 2px rgba(200,169,110,0.6);
    }

    /* Floating geometric accent */
    .geo {
      position: fixed;
      border: 1px solid var(--line);
      border-radius: 50%;
      pointer-events: none;
    }
    .geo-1 {
      width: 380px; height: 380px;
      top: -140px; right: -120px;
      animation: rotateSlow 40s linear infinite;
    }
    .geo-2 {
      width: 200px; height: 200px;
      bottom: -60px; left: -60px;
      animation: rotateSlow 28s linear infinite reverse;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes expandWidth {
      from { width: 0; opacity: 0; }
      to   { width: 48px; opacity: 1; }
    }
    @keyframes fillBar {
      0%   { width: 0; }
      100% { width: 72%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Decorative elements -->
  <div class="rule-top"></div>
  <div class="rule-bottom"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="geo geo-1"></div>
  <div class="geo geo-2"></div>

  <div class="container">
    <p class="label">System Notice</p>

    <h1>We're <em>updating</em><br>our website</h1>

    <div class="divider"></div>

    <p class="message">
      Our team is currently making improvements.<br>
      We'll be back online shortly — thank you for your patience.
    </p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <br><br>
    <span class="status">
      <span class="dot"></span>
      Update in progress
    </span>
  </div>

</body>
</html>
