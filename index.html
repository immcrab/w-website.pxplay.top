<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* CRITICAL: FORCING DARK MODE IMMEDIATELY */
        :root { --bg: #060608; --p: #a78bfa; }
        body, html { 
            background-color: #060608 !important; 
            color: white !important;
            margin: 0; padding: 0;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }
        * { cursor: none !important; }
        #cursor { width: 10px; height: 10px; background: white; border-radius: 50%; position: fixed; pointer-events: none; z-index: 10000; box-shadow: 0 0 15px white; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 30px; 
        }
        .bungee { font-family: 'Bungee'; }
        
        /* PAGE TRANSITIONS */
        .page-view { transition: opacity 0.5s ease; }
        .hidden { display: none !important; }

        /* MUSIC PLAYER */
        .music-player {
            position: fixed; bottom: 30px; left: 30px;
            z-index: 2000; padding: 15px 25px;
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <section id="gate" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#060608]">
        <h1 class="text-[12vw] bungee italic mb-10 tracking-tighter text-white">W</h1>
        <div class="glass p-12 text-center w-full max-w-sm">
            <button onclick="login()" class="w-full py-6 bg-white text-black bungee rounded-2xl hover:scale-105 transition-all">INITIALIZE SESSION</button>
            <p class="mt-8 text-[8px] bungee tracking-[1.5em] opacity-30 text-white">W WEBSITE ACCESS</p>
        </div>
    </section>

    <nav id="main-nav" class="hidden fixed top-0 left-0 right-0 z-[1000] p-6 glass m-4 rounded-[40px] flex justify-between items-center bg-[#060608]/80">
        <div class="flex items-center gap-4">
            <span class="text-4xl bungee italic text-white">W.</span>
        </div>
        <div class="flex gap-8">
            <button onclick="showPage('home')" class="bungee text-[10px] tracking-widest text-white/50 hover:text-white">HOME</button>
            <button onclick="showPage('social')" class="bungee text-[10px] tracking-widest text-white/50 hover:text-white">SOCIAL</button>
            <button onclick="showPage('ai-page')" class="bungee text-[10px] tracking-widest text-white/50 hover:text-white">W-AI</button>
            <button onclick="showPage('locker')" class="bungee text-[10px] tracking-widest text-white/50 hover:text-white">LOCKER</button>
        </div>
        <button id="owner-btn" onclick="showPage('owner')" class="hidden bungee text-[10px] text-yellow-500">OWNER</button>
    </nav>

    <main id="home" class="page-view hidden pt-40 px-8">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-7xl bungee italic mb-10">DASHBOARD</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass p-10 col-span-2">
                    <p class="bungee text-xs text-purple-400 mb-4">W-RANK</p>
                    <h3 class="text-5xl font-bold mb-6">TITANIUM EDITION</h3>
                    <div class="h-2 w-full bg-white/10 rounded-full overflow-hidden">
                        <div class="h-full bg-purple-500 w-[85%]"></div>
                    </div>
                </div>
                <div class="glass p-10 flex flex-col items-center justify-center">
                    <i data-lucide="zap" class="w-12 h-12 text-cyan-400 mb-4"></i>
                    <p class="bungee text-xs">840 XP</p>
                </div>
            </div>
        </div>
    </main>

    <main id="locker" class="page-view hidden pt-40 px-8">
        <div class="max-w-4xl mx-auto">
            <div class="glass p-10">
                <h2 class="text-5xl bungee mb-8">LOCKER</h2>
                <textarea class="w-full h-80 bg-transparent border border-white/10 rounded-2xl p-6 font-mono outline-none text-white focus:border-purple-500"></textarea>
            </div>
        </div>
    </main>

    <div id="player" class="hidden music-player glass flex items-center gap-6">
        <div class="h-10 w-10 bg-purple-500 rounded-lg flex items-center justify-center">
            <i data-lucide="music" class="w-5 h-5 text-white"></i>
        </div>
        <div>
            <p class="bungee text-[8px] tracking-widest">NOW STREAMING</p>
            <p class="text-[10px] font-bold">W-Radio | Heartbreak & Lofi</p>
        </div>
        <button class="h-8 w-8 rounded-full border border-white/20 flex items-center justify-center"><i data-lucide="play" class="w-3 h-3 text-white"></i></button>
    </div>

    <script type="module">
        // [Add your Firebase logic here as before]
        
        window.showPage = (id) => {
            document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };

        window.login = () => {
            // After successful Firebase login:
            document.getElementById('gate').classList.add('hidden');
            document.getElementById('main-nav').classList.remove('hidden');
            document.getElementById('player').classList.remove('hidden');
            showPage('home');
        };

        lucide.createIcons();
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
