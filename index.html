<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website | Community Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <div id="marquee-container" class="bg-yellow-500 text-black py-1 overflow-hidden whitespace-nowrap border-b-2 border-black">
        <div id="marquee-text" class="inline-block font-bold uppercase tracking-tighter animate-marquee">
            LOADING SYSTEM BROADCAST... — 
        </div>
    </div>

    <nav class="sticky top-0 z-40 glass border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-black tracking-tighter italic uppercase">W WEBSITE</h1>
            <span class="bg-green-500/20 text-green-400 text-xs px-2 py-1 rounded-full border border-green-500/50 font-bold">
                LIVE: <span id="user-count">0</span>
            </span>
        </div>
        
        <div class="hidden md:flex items-center gap-8 font-bold text-sm uppercase tracking-widest">
            <a href="#" onclick="showSection('home')" class="hover:text-yellow-500 transition">Home</a>
            <a href="https://wwebsite.sell.app" target="_blank" class="hover:text-yellow-500 transition">Store</a>
            <a href="#" onclick="showSection('profile')" class="hover:text-yellow-500 transition">Dashboard</a>
            <a href="#" onclick="showSection('staff')" class="text-zinc-500 hover:text-white transition">Staff</a>
            <button id="auth-btn" class="bg-white text-black px-4 py-1 rounded-full text-xs font-black hover:bg-yellow-500 transition">LOGIN</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <section id="view-home" class="view-section">
            <h2 class="text-5xl font-black mb-8 uppercase tracking-tighter">Active Hubs</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-4" id="hubs-grid"></div>
        </section>

        <section id="view-profile" class="view-section hidden">
            <h2 class="text-5xl font-black mb-8 uppercase tracking-tighter">Your Profile</h2>
            <div class="glass p-8 rounded-3xl max-w-2xl border-white/10">
                <div class="flex items-center gap-6 mb-8">
                    <img id="profile-img" src="" class="w-20 h-20 rounded-full border-4 border-zinc-700 hidden">
                    <div id="profile-icon-placeholder" class="w-20 h-20 bg-zinc-800 rounded-full flex items-center justify-center border-4 border-zinc-700">
                        <i data-lucide="user" class="w-10 h-10"></i>
                    </div>
                    <div>
                        <p class="text-zinc-400 font-bold uppercase text-xs tracking-widest">User Identity</p>
                        <h3 class="text-3xl font-black" id="profile-username">GUEST_USER</h3>
                        <p id="profile-email" class="text-xs text-zinc-500 font-mono"></p>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl border border-white/5">
                        <span class="font-bold">Media Consent</span>
                        <span id="consent-badge" class="px-3 py-1 rounded-full text-xs font-black uppercase bg-red-500/20 text-red-500 border border-red-500/50">Missing</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-staff" class="view-section hidden">
            <h2 class="text-5xl font-black mb-8 uppercase tracking-tighter text-blue-500">Staff Hub</h2>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="md:col-span-2 glass p-6 rounded-3xl border-blue-500/30">
                    <h3 class="text-xl font-black mb-4 uppercase flex items-center gap-2"><i data-lucide="users"></i> Registered Members</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="text-zinc-500 font-black uppercase text-xs border-b border-white/10">
                                <tr>
                                    <th class="pb-3">User</th>
                                    <th class="pb-3">UID</th>
                                    <th class="pb-3 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="user-ledger-body">
                                </tbody>
                        </table>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl border-blue-500/30">
                    <h3 class="text-xl font-black mb-6 uppercase">Admin Controls</h3>
                    <label class="block text-xs font-black uppercase text-zinc-500 mb-2">Update Broadcast</label>
                    <input type="text" id="marquee-input" class="w-full bg-zinc-900 border-2 border-zinc-800 rounded-xl px-4 py-3 mb-2 outline-none focus:border-yellow-500 transition">
                    <button id="update-marquee-btn" class="w-full bg-blue-600 font-black py-3 rounded-xl uppercase text-sm">Push to Marquee</button>
                </div>
            </div>
        </section>
    </main>

    <div id="consent-modal" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/90 backdrop-blur-xl hidden">
        <div class="glass max-w-lg w-full p-10 rounded-[2.5rem] border-yellow-500/50">
            <h2 class="text-4xl font-black mb-2 uppercase tracking-tighter">Safety Protocol</h2>
            <div class="space-y-4 my-8">
                <label class="flex items-start gap-4 p-4 rounded-2xl hover:bg-white/5 transition cursor-pointer border border-white/10">
                    <input type="checkbox" class="w-6 h-6 mt-1 accent-yellow-500" id="consent-check">
                    <span class="text-sm font-bold">I agree to the W Website data handling and community standards.</span>
                </label>
            </div>
            <button id="submit-consent-btn" class="w-full bg-zinc-100 text-zinc-950 font-black py-5 rounded-2xl uppercase hover:bg-yellow-500 transition">Accept and Continue</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
