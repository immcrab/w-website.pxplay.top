<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W-Website | The Vault V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0d0d0d;
      --text-main: #fdfbf7;
      --card-cream: #1a1a1a;
      --card-yellow: #3d350d;
      --card-blue: #0f2a42;
      --card-pink: #421421;
      --neon-yellow: #ffeb85;
      --owner-purple: #2d1345;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Comic Neue', cursive;
      background-image: radial-gradient(rgba(255, 235, 133, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      min-height: 100vh;
    }

    nav {
      display: flex; justify-content: center; gap: 10px; padding: 15px;
      position: sticky; top: 0; z-index: 100; background: rgba(13, 13, 13, 0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid #333;
    }

    nav button {
      background: #222; color: white; border: 1px solid #444;
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;
    }

    nav button:hover { background: var(--neon-yellow); color: black; }
    #nav-owner { display: none; border-color: #a855f7; color: #a855f7; }

    .page { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card {
      border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px;
      background: var(--card-cream); position: relative;
    }

    /* Profile UI */
    .profile-area { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding: 10px; border-radius: 10px; background: #000; }
    .pfp-circle { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-yellow); }

    /* Chat Styling */
    #chat-messages { height: 400px; overflow-y: auto; background: #050505; border-radius: 8px; padding: 15px; margin-bottom: 10px; border: 1px solid #222; }
    .msg { margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .msg-content { background: #1a1a1a; padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; }
    .msg-name { font-weight: bold; color: var(--neon-yellow); font-size: 0.8rem; display: block; }
    
    /* Inputs */
    input, textarea, select {
      width: 100%; padding: 12px; margin: 8px 0; background: #111; color: white;
      border: 1px solid #333; border-radius: 6px;
    }
    .btn { background: var(--neon-yellow); color: black; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-red { background: #ff4d4d; color: white; }
    .btn-green { background: #2ecc71; color: white; }

    .app-item { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--neon-yellow); }
  </style>
</head>
<body>

  <nav>
    <button onclick="showPage('home')">🏠 Home</button>
    <button onclick="showPage('chat')">💬 Hub</button>
    <button onclick="showPage('apply')">📝 Apply</button>
    <button id="nav-owner" onclick="showPage('ownerpage123')">👑 OWNER</button>
  </nav>

  <section id="home" class="page active">
    <div class="card" style="text-align: center;">
        <h1 style="font-family: 'Shrikhand'; font-size: 3rem; color: var(--neon-yellow);">W-WEBSITE</h1>
        <div id="auth-ui">
            <button id="login-btn" class="btn">🔑 Login with Google</button>
        </div>
    </div>

    <div id="profile-settings" class="card" style="display: none;">
        <h3>Your Identity</h3>
        <div class="profile-area">
            <img id="my-pfp-preview" src="https://via.placeholder.com/50" class="pfp-circle">
            <div>
                <b id="my-display-name">User</b><br>
                <small id="my-email"></small>
            </div>
        </div>
        <input type="text" id="set-username" placeholder="Custom Username">
        <input type="text" id="set-pfp" placeholder="Profile Pic/GIF URL">
        <button id="save-profile" class="btn">Update Profile</button>
        <button id="logout-btn" class="btn btn-red" style="margin-left: 10px;">Logout</button>
    </div>
  </section>

  <section id="chat" class="page">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="font-family: 'Shrikhand';">THE HUB</h2>
            <select id="chat-room-select" style="width: 150px;">
                <option value="global">Global</option>
                <option value="staff-only">Staff Only</option>
                <option value="custom">Private Room...</option>
            </select>
        </div>
        <div id="chat-messages"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="send-btn" class="btn">SEND</button>
        </div>
    </div>
  </section>

  <section id="apply" class="page">
    <div class="card">
        <h2>Staff Application</h2>
        <p>Want powers? Tell us why.</p>
        <textarea id="app-reason" placeholder="What can you do for the W-Website?"></textarea>
        <button id="submit-app-btn" class="btn">Submit to Owners</button>
    </div>
  </section>

  <section id="ownerpage123" class="page">
    <div class="card" style="background: var(--owner-purple);">
        <h1 style="font-family: 'Shrikhand';">OWNER COMMAND</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div>
                <h3>Manage Applications</h3>
                <div id="owner-apps-list"></div>
            </div>
            <div>
                <h3>Staff List</h3>
                <div id="owner-staff-list"></div>
            </div>
        </div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, serverTimestamp, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgQRvvNbr8tY4OP0Ky-6Uy6LI1gWFlAXM",
      authDomain: "makerlee.firebaseapp.com",
      databaseURL: "https://makerlee-default-rtdb.firebaseio.com",
      projectId: "makerlee",
      storageBucket: "makerlee.firebasestorage.app",
      messagingSenderId: "730881046345",
      appId: "1:730881046345:web:bf0fb8862db08de7604c98"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const OWNERS = ["imcrabfr@gmail.com", "bwilliams043@stpaul.k12.mn.us"];
    let currentRoom = "global";
    let myProfile = { username: "", pfp: "" };

    window.showPage = (pageId) => {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    };

    // --- AUTH LOGIC ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('profile-settings').style.display = 'block';
        document.getElementById('my-email').innerText = user.email;
        
        // Check if Owner
        if (OWNERS.includes(user.email)) {
            document.getElementById('nav-owner').style.display = 'block';
            loadOwnerView();
        }

        // Load personal profile from DB
        onValue(ref(db, `profiles/${user.uid}`), (snap) => {
            const data = snap.val();
            if(data) {
                myProfile = data;
                document.getElementById('my-display-name').innerText = data.username || user.displayName;
                document.getElementById('my-pfp-preview').src = data.pfp || "https://via.placeholder.com/50";
            }
        });

        loadChat(currentRoom);
      } else {
        document.getElementById('auth-ui').style.display = 'block';
        document.getElementById('profile-settings').style.display = 'none';
        document.getElementById('nav-owner').style.display = 'none';
      }
    });

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

    // --- PROFILE LOGIC ---
    document.getElementById('save-profile').onclick = () => {
        const u = document.getElementById('set-username').value;
        const p = document.getElementById('set-pfp').value;
        if(!u) return alert("Enter a username!");
        set(ref(db, `profiles/${auth.currentUser.uid}`), {
            username: u,
            pfp: p || "https://via.placeholder.com/50",
            email: auth.currentUser.email
        });
        alert("Profile Updated!");
    };

    // --- CHAT LOGIC ---
    document.getElementById('chat-room-select').onchange = (e) => {
        let val = e.target.value;
        if(val === "custom") {
            val = prompt("Enter Private Room Name:");
            if(!val) return;
        }
        currentRoom = val;
        loadChat(currentRoom);
    };

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('chat-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    function sendMessage() {
        const text = document.getElementById('chat-input').value;
        if(!text.trim() || !auth.currentUser) return;
        
        push(ref(db, `messages/${currentRoom}`), {
            uid: auth.currentUser.uid,
            name: myProfile.username || auth.currentUser.displayName,
            pfp: myProfile.pfp || "",
            text: text,
            email: auth.currentUser.email,
            timestamp: serverTimestamp()
        });
        document.getElementById('chat-input').value = "";
    }

    function loadChat(room) {
        onValue(ref(db, `messages/${room}`), (snap) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                const isOwner = OWNERS.includes(m.email) ? ' (OWNER)' : '';
                box.innerHTML += `
                    <div class="msg">
                        <img src="${m.pfp || 'https://via.placeholder.com/40'}" class="pfp-circle" style="width:35px; height:35px;">
                        <div class="msg-content">
                            <span class="msg-name">${m.name}${isOwner}</span>
                            ${m.text}
                        </div>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    // --- APPLICATION LOGIC ---
    document.getElementById('submit-app-btn').onclick = () => {
        if(!auth.currentUser) return alert("Login first!");
        push(ref(db, 'applications'), {
            uid: auth.currentUser.uid,
            email: auth.currentUser.email,
            name: myProfile.username || auth.currentUser.displayName,
            reason: document.getElementById('app-reason').value,
            status: 'pending'
        });
        alert("App Sent!");
    };

    // --- OWNER CONTROL LOGIC ---
    function loadOwnerView() {
        // Load Applications
        onValue(ref(db, 'applications'), (snap) => {
            const list = document.getElementById('owner-apps-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const app = child.val();
                const id = child.key;
                list.innerHTML += `
                    <div class="app-item">
                        <b>${app.name}</b> (${app.email})<br>
                        <p style="font-size:0.8rem; color:#ccc;">${app.reason}</p>
                        <div style="margin-top:10px;">
                            <button class="btn btn-green" onclick="acceptApp('${id}', '${app.email}')">Accept</button>
                            <button class="btn btn-red" onclick="deleteApp('${id}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        // Load Staff List
        onValue(ref(db, 'staff'), (snap) => {
            const list = document.getElementById('owner-staff-list');
            list.innerHTML = "";
            snap.forEach(child => {
                list.innerHTML += `<div class="app-item">${child.val().email} <button class="btn btn-red" style="padding:2px 5px;" onclick="removeStaff('${child.key}')">X</button></div>`;
            });
        });
    }

    // These need to be global for the onclick in the string HTML to work
    window.acceptApp = (id, email) => {
        push(ref(db, 'staff'), { email: email });
        remove(ref(db, `applications/${id}`));
        alert("User promoted to Staff!");
    };

    window.deleteApp = (id) => {
        if(confirm("Delete this application?")) remove(ref(db, `applications/${id}`));
    };

    window.removeStaff = (id) => {
        if(confirm("Remove staff powers?")) remove(ref(db, `staff/${id}`));
    };

  </script>
</body>
</html>
