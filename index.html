<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website 2.0 | Master Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%);
            color: white;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }
        .neo-glow-purple { box-shadow: 0 0 40px -10px rgba(124, 58, 237, 0.3); }
        .neo-glow-red { box-shadow: 0 0 40px -10px rgba(239, 68, 68, 0.3); }
        .shimmer {
            background: linear-gradient(90deg, #7c3aed, #d8b4fe, #7c3aed);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer { to { background-position: 200% center; } }
        .update-item { border-left: 4px solid #7c3aed; background: linear-gradient(90deg, rgba(124, 58, 237, 0.1) 0%, transparent 100%); }
    </style>
</head>
<body class="p-4 md:p-12">

    <header class="max-w-7xl mx-auto flex justify-between items-center mb-12">
        <div class="flex items-center gap-5">
            <div class="h-14 w-14 glass flex items-center justify-center font-extrabold text-3xl neo-glow-purple border-purple-500/30">W</div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter shimmer">W WEBSITE</h1>
                <p class="text-[10px] text-gray-500 tracking-[0.2em] uppercase font-bold">
