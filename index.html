<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W Website | Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Bungee&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #a78bfa; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; background-image: radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.08) 0px, transparent 50%); background-attachment: fixed; overflow-x: hidden; }
        .ultra-glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 25px; }
        .btn-main { transition: all 0.2s ease; font-family: 'Bungee', cursive; border-radius: 12px; }
        .btn-main:hover { transform: translateY(-1px); filter: brightness(1.2); }
        .hidden-panel { display: none; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; outline: none; width: 100%; font-size: 13px; }
        
        /* Chat Scrollbar */
        .chat-scroll::-webkit-scrollbar { width: 3px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .chat-tab { transition: all 0.3s; cursor: pointer; border-left: 3px solid transparent; }
        .chat-tab.active { background: rgba(167, 139, 250, 0.1); border-left-color: var(--accent); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-0 left-0 right-0 z-50 p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-3xl font-black italic tracking-tighter">W<span class="text-purple-500">.</span></div>
            <div id="auth-hub" class="ultra-glass px-4 py-2 flex items-center gap-4">
                <button onclick="toggleModal()" id="login-btn" class="btn-main bg-white text-black px-4 py-2 text-[10px]">SIGN IN</button>
            </div>
        </div>
    </nav>

    <main id="public-view" class="pt-32 pb-10 px-6 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-[75vh]">
            
            <div class="lg:col-span-1 space-y-4 flex flex-col">
                <div class="ultra-glass p-6 flex-1 flex flex-col">
                    <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-6">W Official News</h3>
                    <div id="news-feed" class="space-y-4 overflow-y-auto chat-scroll pr-2">
                        <p class="text-[11px] text-gray-400 italic">No updates yet.</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 flex gap-4 h-full">
                
                <div class="w-64 ultra-glass p-4 flex flex-col gap-2 h-full overflow-y-auto chat-scroll">
                    <div class="flex justify-between items-center mb-4 px-2">
                        <span class="text-[10px] font-black text-purple-400 uppercase">My Chats</span>
                        <button onclick="openJoinModal()" class="text-xs bg-white/5 h-6 w-6 rounded-full hover:bg-white/10">+</button>
                    </div>
                    <div id="my-chat-list" class="space-y-1">
                        </div>
                </div>

                <div class="flex-1 ultra-glass flex flex-col overflow-hidden relative">
                    <div id="chat-lock" class="absolute inset-0 z-10 bg-black/60 backdrop-blur-md flex items-center justify-center text-center p-10">
                        <div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Secure Connection Required</p>
                            <h4 class="text-xl font-['Bungee']">Sign in & join a chat to begin</h4>
                        </div>
                    </div>

                    <div class="p-5 border-b border-white/5 flex justify-between items-center bg-white/[0.01]">
                        <div>
                            <h3 id="current-chat-title" class="font-black italic text-sm">Select a Chat</h3>
                            <p id="current-chat-type" class="text-[9px] text-gray-500 uppercase font-bold tracking-tighter">Standby</p>
                        </div>
                        <div class="h-2 w-2 rounded-full bg-gray-600" id="chat-status"></div>
                    </div>

                    <div id="chat-content" class="flex-1 p-6 overflow-y-auto chat-scroll space-y-4">
                        </div>

                    <div class="p-5 border-t border-white/5 bg-white/[0.01]">
                        <div class="flex gap-3">
                            <input type="text" id="msg-input" placeholder="Say something...">
                            <button onclick="sendMsg()" class="btn-main bg-white text-black px-6 text-[10px] uppercase font-black">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="joinModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-6">
        <div class="ultra-glass p-8 w-full max-w-sm">
            <h2 class="text-2xl font-['Bungee'] mb-2">Join a Chat</h2>
            <p class="text-[10px] text-gray-500 mb-6 uppercase font-bold">Private or Public Code Required</p>
            <input type="text" id="join-code" placeholder="Enter Code (e.g. W-5521)" class="mb-4 text-center tracking-widest font-black uppercase">
            <div class="flex gap-2">
                <button onclick="addChat('Private')" class="flex-1 btn-main bg-white/5 py-3 text-[10px] hover:border-purple-500/50 border border-transparent">PRIVATE</button>
                <button onclick="addChat('Group')" class="flex-1 btn-main bg-purple-600 py-3 text-[10px]">GROUP</button>
            </div>
            <button onclick="closeJoinModal()" class="w-full mt-4 text-[9px] text-gray-600 font-black uppercase hover:text-white">Cancel</button>
        </div>
    </div>

    <div id="owner-panel" class="hidden-panel fixed inset-0 z-[150] bg-[#050505] p-10 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-12">
                <h2 class="text-4xl font-['Bungee'] text-purple-500">OWNER CONSOLE</h2>
                <button onclick="location.reload()" class="text-xs text-gray-500 underline">Exit</button>
            </div>
            <div class="ultra-glass p-8 border-purple-500/20">
                <h3 class="text-xs font-black mb-6 text-gray-400 uppercase">Post Official Update</h3>
                <input type="text" id="owner-up-title" placeholder="Update Title" class="mb-4">
                <textarea id="owner-up-content" placeholder="Update Body" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-sm mb-4 outline-none"></textarea>
                <button onclick="postUpdate()" class="btn-main bg-purple-600 w-full py-4 text-xs">POST TO SIDEBAR</button>
            </div>
        </div>
    </div>

    <div id="loginModal" class="fixed inset-0 bg-black/95 z-[200] hidden flex items-center justify-center p-6">
        <div class="ultra-glass p-10 w-full max-w-sm">
            <h2 class="text-2xl font-['Bungee'] mb-6 text-center italic">SIGN IN</h2>
            <input type="email" id="u-email" placeholder="Email" class="mb-4">
            <button id="u-login" class="btn-main bg-white text-black w-full py-4 text-[10px] font-black">LOG IN</button>
        </div>
    </div>

    <script>
        let signedIn = false;
        let isOwner = false;
        let userEmail = "";
        let activeChats = [];
        let currentChatId = null;

        // AUTH
        function toggleModal() { document.getElementById('loginModal').classList.toggle('hidden'); }
        document.getElementById('u-login').addEventListener('click', () => {
            userEmail = document.getElementById('u-email').value;
            if(!userEmail) return;
            signedIn = true;
            if(userEmail === "wwebsiteofficial@outlook.com") isOwner = true;
            document.getElementById('login-btn').innerText = userEmail.split('@')[0].toUpperCase();
            document.getElementById('chat-lock').classList.add('hidden');
            toggleModal();
        });

        // MULTI-CHAT LOGIC
        function openJoinModal() { if(signedIn) document.getElementById('joinModal').classList.remove('hidden'); }
        function closeJoinModal() { document.getElementById('joinModal').classList.add('hidden'); }

        function addChat(type) {
            const code = document.getElementById('join-code').value.toUpperCase();
            if(!code) return;
            
            const chat = { id: code, title: code, type: type, messages: [] };
            activeChats.push(chat);
            renderChatList();
            switchChat(code);
            closeJoinModal();
            document.getElementById('join-code').value = "";
        }

        function renderChatList() {
            const list = document.getElementById('my-chat-list');
            list.innerHTML = "";
            activeChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-tab p-3 rounded-lg text-xs font-bold ${currentChatId === chat.id ? 'active' : ''}`;
                div.innerHTML = `<p>${chat.title}</p><p class="text-[8px] text-gray-500 font-black">${chat.type}</p>`;
                div.onclick = () => switchChat(chat.id);
                list.appendChild(div);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            const chat = activeChats.find(c => c.id === id);
            document.getElementById('current-chat-title').innerText = chat.title;
            document.getElementById('current-chat-type').innerText = chat.type + " SESSION";
            document.getElementById('chat-status').className = "h-2 w-2 rounded-full bg-green-500";
            renderMessages();
            renderChatList();
        }

        function sendMsg() {
            const val = document.getElementById('msg-input').value;
            if(!val || !currentChatId) return;
            const chat = activeChats.find(c => c.id === currentChatId);
            chat.messages.push({ sender: userEmail.split('@')[0], text: val });
            document.getElementById('msg-input').value = "";
            renderMessages();
        }

        function renderMessages() {
            const box = document.getElementById('chat-content');
            box.innerHTML = "";
            const chat = activeChats.find(c => c.id === currentChatId);
            chat.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = "p-3 bg-white/5 rounded-xl border border-white/5 max-w-[80%]";
                div.innerHTML = `<p class="text-[9px] font-black text-purple-400 uppercase mb-1">${m.sender}</p><p class="text-xs">${m.text}</p>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        // UPDATES SYSTEM
        function postUpdate() {
            const t = document.getElementById('owner-up-title').value;
            const c = document.getElementById('owner-up-content').value;
            if(!t || !c) return;
            const feed = document.getElementById('news-feed');
            if(feed.querySelector('p.italic')) feed.innerHTML = "";
            const div = document.createElement('div');
            div.className = "mb-4 border-b border-white/5 pb-2";
            div.innerHTML = `<h4 class="text-[11px] font-black text-purple-400 uppercase">${t}</h4><p class="text-[10px] text-gray-400">${c}</p>`;
            feed.prepend(div);
            alert("Official update posted.");
        }

        // HANDSHAKE
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (keys['l'] && keys['p'] && isOwner) {
                document.getElementById('owner-panel').classList.remove('hidden-panel');
            }
        });
        document.addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);
    </script>
</body>
</html>
