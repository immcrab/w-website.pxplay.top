<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | W Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <nav class="glass border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-2xl font-black tracking-tighter italic uppercase hover:text-yellow-500 transition">W WEBSITE</a>
        </div>
        <div class="flex gap-6 font-bold text-xs uppercase tracking-widest">
            <a href="index.html" class="hover:text-yellow-500 transition">Home</a>
            <a href="text.html" class="hover:text-yellow-500 transition">Messages</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-10">
        <div class="glass p-12 rounded-[3rem] border-white/5 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-yellow-500/10 blur-[100px] rounded-full"></div>
            
            <div id="profile-loader" class="text-center py-20">
                <div class="animate-spin w-10 h-10 border-4 border-yellow-500 border-t-transparent rounded-full mx-auto mb-4"></div>
                <p class="font-black uppercase text-xs tracking-widest text-zinc-500">Decrypting Profile Data...</p>
            </div>

            <div id="profile-content" class="hidden">
                <div class="flex flex-col md:flex-row items-center gap-10 mb-12">
                    <img id="view-avatar" src="" class="w-40 h-40 rounded-[2.5rem] border-4 border-zinc-800 shadow-2xl">
                    <div class="text-center md:text-left">
                        <span id="view-role" class="bg-yellow-500 text-black px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter">Member</span>
                        <h1 id="view-name" class="text-6xl font-black tracking-tighter uppercase mt-2 italic">Loading...</h1>
                        <p id="view-uid" class="text-zinc-500 font-mono text-xs mt-2 uppercase tracking-widest"></p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/5 p-6 rounded-3xl border border-white/5">
                        <p class="text-zinc-500 font-black text-[10px] uppercase mb-1">Status</p>
                        <p class="font-bold flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]"></span> Online
                        </p>
                    </div>
                    <div class="bg-white/5 p-6 rounded-3xl border border-white/5">
                        <p class="text-zinc-500 font-black text-[10px] uppercase mb-1">Account Created</p>
                        <p id="view-created" class="font-bold uppercase text-sm">2026_PROTOCOL</p>
                    </div>
                </div>
                
                <button onclick="window.location.href='text.html'" class="w-full mt-10 bg-zinc-100 text-zinc-950 font-black py-4 rounded-2xl uppercase tracking-widest hover:bg-yellow-500 transition">
                    Send Direct Message
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { /* USE YOUR PREVIOUS CONFIG HERE */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const params = new URLSearchParams(window.location.search);
        const targetUid = params.get('uid');

        onAuthStateChanged(auth, async (user) => {
            const uidToFetch = targetUid || (user ? user.uid : null);
            
            if (uidToFetch) {
                const userDoc = await getDoc(doc(db, "users", uidToFetch));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('view-name').innerText = data.name;
                    document.getElementById('view-avatar').src = data.photo;
                    document.getElementById('view-uid').innerText = `ID: ${uidToFetch}`;
                    document.getElementById('view-role').innerText = data.role || "Member";
                    
                    document.getElementById('profile-loader').classList.add('hidden');
                    document.getElementById('profile-content').classList.remove('hidden');
                }
            } else if (!targetUid) {
                window.location.href = "index.html"; // Redirect if not logged in and no target
            }
        });
        lucide.createIcons();
    </script>
</body>
</html>
